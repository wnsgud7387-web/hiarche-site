<style>

*{box-sizing:border-box}

<style>

        <div class="cg-big">${c}<span style="font-size:1.125rem;color:var(--sub)"> / 8</span></div><p class="cg-ask">${c===PAIRS_N?T.allIn:T.roundRes}</p>
        ${last?'':`<p class="cg-p">${T.againMiss}</p>`}<div class="cg-stack"><button class="cg-btn" data-next>${last?T.next:T.goOn}</button></div></section>`);
      $1('[data-next]').onclick=()=>{ if(last){ const full=rounds.slice(); while(full.length<ROUNDS) full.push(PAIRS_N);
          const k=rounds.indexOf(PAIRS_N); S.raw.learn={rounds,sum:full.reduce((a,b)=>a+b,0),toLearn:k<0?null:k+1,end:null}; done(); }
        else round(); }; };
    round(); } }

function endRecall(done){ S.step=FLOW.length; const l=root.querySelector('.cg-steplab'); if(l) l.textContent=T.stepEnd; root.querySelectorAll('.cg-seg').forEach(s=>s.classList.add('done'));

/* ═══ LQ 2.0 과제(대표님 10-19): 추론 합치기 · 언어 추론 · 확신도(메타인지) · 힌트로 배우기 · 시간 압박 ═══ */
// 확신도: 본 문제에서 답을 고른 뒤 한 번 더 누른다(1 · 0.5 · 0). 점수(LQ)에는 넣지 않고 '내가 아는 걸 아는 힘'에만 쓴다.
const CONF=[1,0.5,0];
function confRow(cb){ const af=$1('.cg-after'); if(!af) return cb(null); af.classList.add('cg-dock');
  af.innerHTML=`<p class="cg-confq">${T.confQ}</p><div class="cg-conf" role="group" aria-label="${esc(T.confQ)}">${CONF.map((v,k)=>`<button data-c="${k}">${T['conf'+k]}</button>`).join('')}</div>`;
  const held=!!(C&&!C.paused); if(held){ C.paused=true; }   // 확신도를 누르는 시간은 제한 시간에서 빼요(사용자 시험 10-19)
  af.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ af.querySelectorAll('[data-c]').forEach(x=>x.disabled=true); b.classList.add('sel'); if(held&&C){ C.paused=false; C.last=now(); } cb(CONF[+b.dataset.c]); }); }
const addConf=resp=>{ S.conf=(S.conf||[]).concat(resp.filter(x=>x.cf!=null).map(x=>({ok:!!x.ok,cf:x.cf}))); };

/* ─── ① 규칙 찾기(9칸 그림 + 숫자 줄을 한 과제로, 번갈아 냄) ─── */
function aReason(done){
  intro('reason',()=>practice([()=>genMatrix(1),()=>genSeq(1)],(it,i,n,go)=>(it.grid?mxItem:seqItem)(it,{prac:true,i,n,conf:true},go),()=>ready('reason',DUR.reason,run)));
  function run(){ const resp=[]; let fin=false, cur=null; const t0=now(); seqRecent=[];
    const end=timed=>{ if(fin) return; fin=true; clockStop(); const nAns=resp.length; if(timed&&cur) resp.push(Object.assign({},cur,{ok:false,ms:null,cf:null,late:1})); const e=eap(resp);
      S.raw.reason={theta:r3(e.m),se:r3(e.se),n:nAns,right:resp.filter(x=>x.ok).length,max:REASON_MAX,timed:timed?1:0,items:resp.map(x=>[x.k,x.lv,x.ok?1:0,x.ms,x.cf]),sec:r1((now()-t0)/1000)};
      addConf(resp.filter(x=>!x.late)); timed?timeUp(done,nAns):done(); };
    const nextQ=()=>{ if(fin) return; if(resp.length>=REASON_MAX) return end(false);
      const lv=nextLv(resp,2), mx=resp.length%2===0, it=mx?genMatrix(lv):genSeq(lv); S.itemFrac=resp.length/REASON_MAX; cur={k:mx?'m':'s',lv,b:LEVEL_B[lv-1],c:mx?1/6:1/4};
      (mx?mxItem:seqItem)(it,{i:resp.length+1,n:REASON_MAX,conf:true},(ok,ms,cf)=>{ if(fin) return; cur=null; resp.push({k:mx?'m':'s',lv,b:LEVEL_B[lv-1],c:mx?1/6:1/4,ok,ms,cf}); later(nextQ,160*F); }); };
    clockStart(DUR.reason*F,()=>end(true)); nextQ(); } }

/* ─── ② 말의 관계(언어 추론) ─── */
function genVerbal(lv,used){ const bank=VB[L][lv-1]; let idx=bank.map((_,i)=>i).filter(i=>!used.has(lv+':'+i)); if(!idx.length) idx=bank.map((_,i)=>i);
  const i=pick(idx); used.add(lv+':'+i); const it=bank[i], order=shuffle([0,1,2,3]); return {q:it[0],opts:order.map(k=>it[1][k]),ci:order.indexOf(0)}; }
function vbItem(it,o,cb){ main(`<section data-screen="${o.prac?'prac-verbal':'verbal-item'}">${head(o.prac,o.i,o.n)}
  ${(()=>{ const ps=String(it.q).split('\n'); return `<p class="cg-vq">${esc(ps[0])}</p>${ps.length>1?`<p class="cg-rd cg-prem">${ps.slice(1).map(esc).join('<br>')}</p>`:''}`; })()}
  <div class="cg-vopts" role="group">${it.opts.map((v,k)=>`<button class="cg-ans"${mark(k===it.ci)}>${esc(v)}</button>`).join('')}</div>
  <div class="cg-fb" role="status"></div><div class="cg-after"></div></section>`);
  bindMC(it.ci,o.prac,cb,o.conf); }
function aVerbal(done){ const used=new Set();
  intro('verbal',()=>practice([()=>genVerbal(1,used)],(it,i,n,go)=>vbItem(it,{prac:true,i,n,conf:true},go),()=>ready('verbal',DUR.verbal,run)));
  function run(){ const resp=[]; let fin=false, cur=null; const t0=now();
    const end=timed=>{ if(fin) return; fin=true; clockStop(); const nAns=resp.length; if(timed&&cur) resp.push(Object.assign({},cur,{ok:false,ms:null,cf:null,late:1})); const e=eap(resp);
      S.raw.verbal={theta:r3(e.m),se:r3(e.se),n:nAns,right:resp.filter(x=>x.ok).length,max:VERBAL_MAX,timed:timed?1:0,items:resp.map(x=>[x.lv,x.ok?1:0,x.ms,x.cf]),sec:r1((now()-t0)/1000),lang:L};
      addConf(resp.filter(x=>!x.late)); timed?timeUp(done,nAns):done(); };
    const nextQ=()=>{ if(fin) return; if(resp.length>=VERBAL_MAX) return end(false);
      const lv=nextLv(resp,2), it=genVerbal(lv,used); S.itemFrac=resp.length/VERBAL_MAX; cur={lv,b:LEVEL_B[lv-1],c:1/4};
      vbItem(it,{i:resp.length+1,n:VERBAL_MAX,conf:true},(ok,ms,cf)=>{ if(fin) return; cur=null; resp.push({lv,b:LEVEL_B[lv-1],c:1/4,ok,ms,cf}); later(nextQ,160*F); }); };
    clockStart(DUR.verbal*F,()=>end(true)); nextQ(); } }

/* ─── ③ 힌트로 배우기(동적 평가) — 대표님 10-19 '너무 쉬움' 반영: 처음 보는 규칙 위주, 보통 사람이 처음 4문제 중 절반쯤 틀리게(잠정) ─── */
// 처음 4문제를 다 맞히면 더 어려운 규칙 2문제를 더 내서, 누구나 '힌트로 배우는 구간'을 거치게 한다.
const DYN_F=['alt2','fib','grow2','mix','sq','mul'];
const DYN_HARD=['sq','fib','grow2'];
function genDyn(f){ let q,a,p;
  for(let g=0;g<60;g++){
    if(f==='alt2'){ const k=ri(2,3), c=ri(2,5), s=ri(1,4); q=[s]; for(let i=1;i<7;i++) q.push(i%2?q[i-1]*k:q[i-1]+c); a=q.pop(); p={k,c}; if(a>900) continue; }
    else if(f==='fib'){ const x=ri(1,4), y=ri(2,6); q=[x,y]; for(let i=2;i<7;i++) q.push(q[i-1]+q[i-2]); a=q.pop(); p={}; }
    else if(f==='grow2'){ const s=ri(1,6), d=ri(1,3), k=ri(2,3); q=[s]; let dd=d; for(let i=1;i<6;i++){ q.push(q[i-1]+dd); dd*=k; } a=q.pop(); p={d,k}; if(a>800) continue; }
    else if(f==='sq'){ const c=pick([-1,1,2,3,5]), o=ri(1,3); q=[]; for(let n=o;n<o+6;n++) q.push(n*n+c); a=q.pop(); p={c,o}; if(q[0]<=0) continue; }
    else if(f==='mul'){ const k=ri(2,3), c=pick([1,2,3,-1,-2]), s=ri(2,5); q=[s]; for(let i=1;i<6;i++) q.push(q[i-1]*k+c); a=q.pop(); p={k,c}; if(a>1500||q.some(v=>v<=0)) continue; }
    else { const x=ri(1,9), y=ri(30,48), da=ri(3,6), dbk=ri(2,3); const t=[]; let ev=y; for(let i=0;i<8;i++){ if(i%2===0) t.push(x+da*(i/2)); else { t.push(ev); ev=ev-dbk*((i+1)/2); } } a=t.pop(); q=t; p={da,db:dbk}; if(q.some(v=>v<=0)||a<=0) continue; }
    break; }
  // 다른 규칙으로도 설명되는 수는 보기에서 뺌(사용자 시험 10-19: 7,32,10,30,13,26,16,? → 18·20)
  const alt=new Set(); if(f==='mix'){ const ev=q.filter((_,i)=>i%2===1), d1=ev[ev.length-2]-ev[ev.length-1]; alt.add(ev[ev.length-1]-2*d1); alt.add(a-p.db); alt.add(a+p.db); }
  const opts=new Set([a]); for(const d of shuffle([1,-1,2,-2,3,4,-3,6,10,-5,5,7,-4])){ if(opts.size>=4) break; const v=a+d; if(v>0&&!alt.has(v)) opts.add(v); }
  const arr=shuffle([...opts]); return {f,q,opts:arr,ci:arr.indexOf(a),a,p}; }
function dynHint(it,lv){ const p=it.p, f=it.f; if(lv===1) return T['h1_'+f];
  if(f==='mul') return tr(p.c>0?'h2_mulP':'h2_mulM',{k:p.k,c:Math.abs(p.c)});
  if(f==='sq') return tr(p.c>0?'h2_sqP':'h2_sqM',{o:p.o,c:Math.abs(p.c)});
  return tr('h2_'+f,p); }
function dynItem(it,o,cb){ main(`<section data-screen="${o.name}"><div class="cg-qhead"><span${o.tag?' class="cg-tag"':''}>${o.lab}</span>${o.j?`<span>${o.j}</span>`:''}</div>
  ${o.hint?`<div class="cg-hint" role="note"><b>${tr('dynHint',{n:o.hl})}</b><span>${esc(o.hint)}</span></div>`:''}
  <p class="cg-ask cg-center">${o.hint?T.dynRetry:T.ask_seq}</p>
  <div class="cg-seq">${it.q.map(v=>`<div class="cg-n">${v}</div>`).join('')}<div class="cg-n q" aria-label="?">?</div></div>
  <div class="cg-opts4">${it.opts.map((v,k)=>`<button class="cg-ans"${mark(k===it.ci)}>${v}</button>`).join('')}</div>
  <div class="cg-fb" role="status"></div><div class="cg-after"></div></section>`);
  const bs=$$('.cg-ans'); const t0=now();
  bs.forEach((b,k)=>b.onclick=()=>{ if(b.disabled) return; bs.forEach(x=>x.disabled=true); b.classList.add('sel'); const ok=k===it.ci, ms=Math.round(now()-t0);
    if(o.hint){ const fb=$1('.cg-fb'); if(fb){ fb.className='cg-fb '+(ok?'ok':'no'); fb.textContent=ok?T.ok:T.dynNotYet; } if(ok) bs[it.ci].classList.add('ok'); return later(()=>cb(ok,ms),900*F); }
    later(()=>cb(ok,ms),160*F); }); }
function msgScr(name,h,p,btn,go,tag){ main(`<section data-screen="${name}" class="cg-card cg-ready cg-anim" style="margin-top:18px"><div class="cg-tag">${tag||T.n_dyn}</div><h2 class="cg-h" tabindex="-1" data-focus>${h}</h2>${p?`<p class="cg-p">${p}</p>`:''}
  <div class="cg-stack"><button class="cg-btn" data-next>${btn}</button></div></section>`); $1('[data-next]').onclick=go; }
function aDyn(done){
  const base=shuffle(['alt2','grow2','mix','mul']), pre=base.map(genDyn), res={pre:[],post:[],hints:0,fixed:0,extra:0};
  intro('dyn',run,T.start);
  function run(){ let i=0; const wrong=[]; const N=()=>pre.length;
    const stepPre=()=>{ if(i>=N()){ if(!wrong.length&&!res.extra){ res.extra=1; DYN_HARD.slice(0,2).forEach(f=>pre.push(genDyn(f))); return msgScr('dyn-more',T.dynMoreH,T.dynMoreP,T.next,stepPre); } return mid(); }
      const it=pre[i]; S.itemFrac=i/12;

function mcOpts(a,cands){ const s=new Set([String(a)]); for(const c of shuffle(cands.map(String))){ if(s.size>=4) break; s.add(c); } const arr=shuffle([...s]); return {opts:arr,ci:arr.indexOf(String(a))}; }
function genFormula(){ const fam=ri(0,3), names=shuffle(NM[L].slice()).slice(0,3), who=ri(0,2), idxName=pick(T.fxNames);
  let rows,a,expr,wrongs;

  const a0=ri(6,15), d=ri(2,6), days=ri(3,4), sum=Array.from({length:days},(_,i)=>a0+d*i).reduce((x,y)=>x+y,0);

/* ═══ 점수 ═══ */
function zs(raw){ const z={}, N=NORM;
  z.reason=(raw.reason.theta-N.reason.m)/N.reason.sd;

  z.rot=((raw.rot.right-raw.rot.wrong)-N.rot.m)/N.rot.sd;                                   // 1분 동안 (맞힘−틀림)
  z.wm=(raw.wm.pc-N.wm.m)/N.wm.sd;
  z.speed=raw.speed?(raw.speed.hit-N.speed.m)/N.speed.sd:null;                                             // 1분 동안 맞힌 개수
  z.learn=(raw.learn.sum-N.learn.m)/N.learn.sd;
  z.keep=raw.keep?(raw.keep.n-N.keep.m)/N.keep.sd:null;
  z.focus=raw.focus?(focusRaw(raw.focus)-N.focus.m)/N.focus.sd:null;

  z.meta=mi==null?null:(mi-N.meta.m)/N.meta.sd; z.dyn=di==null?null:(di-N.dyn.m)/N.dyn.sd; z.press=pi==null?null:(pi-N.press.m)/N.press.sd;

const focusRaw=f=>(f.nogo?1-f.com/f.nogo:1)-(f.go?f.om/f.go:0);
// 집중 저하 → 라이벌 게이지가 내려가는 속도(1 = 보통, 0.6~1.6). 뒤 1/3의 실수율·반응 흔들림이 앞 1/3보다 클수록 빨라짐.

  return clamp(r3(1+1.5*(err(b)-err(a))+2*((b.cv||0)-(a.cv||0))),0.6,1.6); }
const toS=z=>clamp(Math.round(100+15*z),LO,HI);
const to24=x=>Math.round(100+(x-100)*K24);
function typeOf(z,raw){ const zR=z.reason, zW=z.speed!=null?(z.wm+z.speed)/2:z.wm, zL=z.learn; let zK;

  return {code,ko:CT.ko['ty_'+code],en:CT.en['ty_'+code],ja:CT.ja['ty_'+code]}; }
function score(raw){ const z=zs(raw), areas={}; let sw=0,sx=0;
  // LQ = 아래 SHOW 영역만 가중 평균(70~145로 자른 영역 점수). 공부할 때 쓰는 힘(ABL)은 따로 두고 LQ에 넣지 않는다.
  for(const a of SHOW){ areas[a]=toS(z[a]); sw+=NORM[a].w; sx+=NORM[a].w*areas[a]; }
  areas.keep=z.keep==null?null:toS(z.keep);

  const R_AREA=0.5, sdBar=Math.sqrt(s2+R_AREA*(sAll*sAll-s2))/sAll;
  const mid=clamp(Math.round(100+((sx/sw)-100)/sdBar),LO,HI), lo=Math.max(LO,mid-BAND), hi=Math.min(HI,mid+BAND);
  return {idx:{mid,lo,hi},idx24:{mid:to24(mid),lo:to24(lo),hi:to24(hi)},areas,type:typeOf(zc,raw)}; }
function build(raw,at,pairs){ raw.meta=metaRaw(S&&S.conf); const s=score(raw);
  return {v:2,lq:s.idx.mid,at,idx:s.idx,idx24:s.idx24,areas:s.areas,type:s.type,focus:raw.focus?{fat:fatigueOf(raw.focus),score:s.areas.focus}:null,raw,recall:{pairs:pairs.map(p=>({w:p.w,g:p.g})),dueAt:at+RECALL_AFTER,done:false}}; }
const clone=o=>JSON.parse(JSON.stringify(o));

/* ═══ 결과 화면 ═══ */
function curveSVG(lo,hi){ const X=s=>10+(s-55)/90*300, Y=s=>80-64*Math.exp(-Math.pow((s-100)/15,2)/2);
  const path=(a,b)=>{ let d=`M${X(a).toFixed(1)} 80`; for(let s=a;s<=b+0.01;s+=1) d+=`L${X(s).toFixed(1)} ${Y(s).toFixed(1)}`; return d+`L${X(b).toFixed(1)} 80Z`; };
  return `<svg class="cg-curve" viewBox="0 0 320 98" aria-hidden="true"><path d="${path(55,145)}" style="fill:var(--track)"/><path d="${path(lo,hi)}" style="fill:var(--acc)"/>
   <line x1="10" y1="80" x2="310" y2="80" style="stroke:var(--line)" stroke-width="1.5"/>${[70,85,100,115,130,145].map(v=>`<text x="${X(v)}" y="95" text-anchor="middle" style="fill:var(--sub);font-size:10px;font-weight:600">${v}</text>`).join('')}</svg>`; }
const pctOf=v=>clamp(50+(v-100)/45*50,3,100);   // 100 = 가운데, 145 = 끝
function prevOf(res,hist){ if(!Array.isArray(hist)) return null; const c=hist.filter(h=>h&&h.idx&&h.at<res.at).sort((a,b)=>b.at-a.at); return c[0]||null; }
const SPD=L=>{ L=+L||100; return L<88?1:L<96?2:L<105?3:L<114?4:5; };

function spdMeter(s){ return `<div class="cg-spd" role="img" aria-label="${esc(tr('spdAria',{s}))}">${[1,2,3,4,5].map(k=>`<i class="${k<=s?'on':''}"></i>`).join('')}</div>`; }
// 영역마다 근거 한 줄(사용자 시험 10-19: '왜 강함·연습 필요인지 안 보여요')
function evOf(a,raw){ raw=raw||{}; const x=raw[a]; if(!x) return '';
  const pc=v=>Math.round((v||0)*100);
  if(a==='reason'||a==='verbal'){ const n=x.n!=null?x.n:(x.items||[]).length, r=(x.items||[]).filter(it=>it[a==='reason'?2:1]===1).length;
    return tr('ev_q',{n,r})+(x.timed&&x.max&&n<x.max?tr('ev_qt',{n,m:x.max}):'')+(n<6?T.ev_thin:''); }
  if(a==='wm') return tr('ev_wm',{t:x.total,r:x.right,e:(x.sets||[]).reduce((s,v)=>s+(v[2]||0),0)});
  if(a==='learn') return x.rounds?tr('ev_learn',{r:x.rounds.join(' → ')}):'';

  if(a==='dyn'){ const pn=Math.min(4,(x.preAll||[]).length||4); return tr('ev_dyn',{p:x.pre,pn,q:x.post,n:x.n,h:x.hints}); }
  if(a==='press') return tr('ev_press',{c:Math.round(x.calm.acc*PRESS_N),h:Math.round(x.hot.acc*PRESS_N)})+(x.hot.late?tr('ev_pressLate',{l:x.hot.late}):'');

function resultHTML(res,o){ const ty=res.type||{}, code=ty.code||'FL', name=ty[L]||T['ty_'+code], pv=o.prev, A=res.areas||{}, RAW=res.raw||{};
  const evl=a=>{ const t=evOf(a,RAW); return t?`<p class="cg-ev">${esc(t)}</p>`:''; };
  const lvTag=v=>`<div class="cg-av cg-lv ${lvlOf(v)}">${T[lvlOf(v)]}</div>`;
  const row=a=>{ const v=A[a], p=pv&&pv.areas?pv.areas[a]:null;
    return `<div class="cg-arow"><div class="cg-an"><b>${T['n_'+a]}</b><span>${T['g_'+a]}</span></div>${lvTag(v)}
      <div class="cg-trk"><i style="width:${pctOf(v)}%"></i></div>${p!=null?`<div class="cg-trk pv" title="${esc(T.prev)}"><i style="width:${pctOf(p)}%"></i></div>`:''}${evl(a)}</div>`; };
  const keepRow=A.keep!=null?`<div class="cg-arow keep"><div class="cg-an"><b>${T.n_keep}</b><span>${T.g_keep}</span></div>${lvTag(A.keep)}<div class="cg-trk"><i style="width:${pctOf(A.keep)}%"></i></div>${res.raw&&res.raw.keep?`<div class="cg-pend">${tr('keepRaw',{n:res.raw.keep.n,of:res.raw.keep.of||PAIRS_N})}</div>`:''}</div>`
    :`<div class="cg-arow keep"><div class="cg-an"><b>${T.n_keep}</b><span>${T.g_keep}</span></div><div class="cg-av">–</div><div class="cg-trk dash"></div><div class="cg-pend">${recallDue(res)?T.keepNow:T.keepPend}</div></div>`;
  const abl=a=>{ const v=A[a], none=a==='dyn'&&RAW.dyn&&RAW.dyn.wrongPre===0?T.dynAllNone:a==='press'&&RAW.press?T.pressNone:a==='meta'&&RAW.meta?T.metaNone:T.ablNone, tip=a==='meta'&&RAW.meta&&RAW.meta.bias<-0.15?T.tip_metaUnder:T['tip_'+a];
    return `<div class="cg-abl"><div class="cg-an"><b>${T['n_'+a]}</b><span>${T['g_'+a]}</span></div>${v==null?`<div class="cg-av">–</div><p>${none}</p>`:`${lvTag(v)}${evl(a)}<p>${tip}</p>`}</div>`; };
  const lq=res.lq||res.idx.mid, plq=pv?(pv.lq||(pv.idx&&pv.idx.mid)):null;
  return `<section data-screen="result" class="cg-res cg-anim">
  <div class="cg-eyebrow cg-center" tabindex="-1" data-focus>${T.resEyebrow}</div>
  <div class="cg-card cg-type">${TYPE_I}<div><div class="cg-lab">${T.typeLab}</div><div class="cg-tyname">${esc(name)}</div><p>${T['tyd_'+code]||''}</p></div></div>
  <div class="cg-card cg-lqcard"><div class="cg-lab">${T.lqLab}</div>
    <div class="cg-lqv">${tr('lqV',{l:lq})}</div>

  <div class="cg-card"><div class="cg-cardh"><b>${T.areasLab}</b><span>${pv?`<span style="opacity:.7">▬ ${T.prev}</span>`:''}</span></div>${SHOW.filter(a=>A[a]!=null).map(row).join('')}${keepRow}</div>
  <div class="cg-card"><div class="cg-cardh"><b>${T.ablLab}</b></div><p class="cg-ablnote">${T.ablNote}</p>${ABL.map(abl).join('')}</div>
  <ul class="cg-notes"><li>${pv&&plq&&lq<plq?T.retest2:T.retest}</li>${res.recall&&!res.recall.done?`<li>${T.recallNote}</li>`:''}</ul>
  ${o.primary?`<div class="cg-dock"><button class="cg-btn" data-go>${o.primary}</button></div>`:''}
  <div class="cg-stack" style="margin-top:4px">${o.share?`<button class="cg-ghost" data-share>${T.share}</button>`:''}${o.closeBtn?`<button class="cg-ghost" data-close>${T.close}</button>`:''}</div>
  ${refsHTML()}<p class="cg-notice">${T.notice}</p></section>`; }
function bindRefs(){ const a=$1('[data-refs]'); if(a) a.onclick=e=>{ e.preventDefault(); const d=$1('.cg-refs'); if(d){ d.open=true; try{ d.scrollIntoView({behavior:'smooth',block:'start'}); }catch(x){ d.scrollIntoView(); } } }; }
function shareTextOf(res){ const ty=res.type||{}; return tr('shareText',{t:ty[L]||T['ty_'+(ty.code||'FL')],l:res.lq||res.idx.mid}); }
function doShare(res,fn){ if(typeof fn!=='function') return; let url=''; try{ url=shareCard(res); }catch(e){} fn(url,shareTextOf(res)); }

/* ═══ 공유 카드 (1080×1350, 앱 밝은 색, 이름 없음) ═══ */
const PAL={bg:'#f4f1ea',card:'#fffdf8',ink:'#1d1b17',sub:'#6b6458',line:'#e5dfd2',track:'#ece6d9',acc:'#2f5d50',accsoft:'#e3ede8',dop:'#7a5cc4',dopink:'#6a4fb0',dopsoft:'#efe9fb',amber:'#c98a1b'};
function shareCard(res){ setLang(); const cv=document.createElement('canvas'); cv.width=1080; cv.height=1350; const x=cv.getContext('2d'); const P=PAL;
  const FF='-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Noto Sans",system-ui,sans-serif';
  const font=(w,s)=>{ x.font=`${w} ${s}px ${FF}`; };
  const circ=(cx,cy,r,c)=>{ x.fillStyle=c; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill(); };
  const rr=(X,Y,W,H,R)=>{ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); };
  const wrap=(t,maxW)=>{ const ws=String(t).split(' '),out=[]; let line=''; for(const w of ws){ const tt=line?line+' '+w:w; if(x.measureText(tt).width>maxW&&line){ out.push(line); line=w; } else line=tt; } if(line) out.push(line); return out; };
  x.fillStyle=P.bg; x.fillRect(0,0,1080,1350);
  circ(122,98,20,P.dop); rr(98,122,50,34,17); x.fillStyle=P.dop; x.fill(); circ(96,108,22,P.acc); rr(68,132,56,36,18); x.fillStyle=P.acc; x.fill();
  font(800,46); x.fillStyle=P.ink; x.textBaseline='alphabetic'; x.fillText(T.app,170,146);
  font(650,30); x.fillStyle=P.sub; x.fillText(T.cardTop,72,228);
  rr(56,262,968,958,48); x.fillStyle=P.card; x.fill(); x.lineWidth=3; x.strokeStyle=P.line; x.stroke();
  const ty=res.type||{}; font(650,32); x.fillStyle=P.sub; x.fillText(T.typeLab,112,340);
  font(800,60); x.fillStyle=P.dopink; const tl=wrap(ty[L]||T['ty_'+(ty.code||'FL')],856).slice(0,2); let y=414; tl.forEach(s=>{ x.fillText(s,112,y); y+=74; });
  y+=96; font(850,104); x.fillStyle=P.ink; x.fillText(tr('lqV',{l:res.lq||res.idx.mid}),108,y);
  font(600,28); x.fillStyle=P.sub; wrap(T.cardScale,856).slice(0,2).forEach((s,i)=>x.fillText(s,112,y+56+i*38));
  y+=56+38*Math.min(2,wrap(T.cardScale,856).length);
  x.fillStyle=P.line; x.fillRect(112,y+20,856,3);
  const A=res.areas||{}, bars=SHOW.filter(a=>A[a]!=null).map(a=>['n_'+a,A[a]]);
  let by=y+90; const bx=112,bw=856, step=Math.min(76,(1188-by)/bars.length);

    x.textAlign='right'; x.fillText(T[lvlOf(v)],bx+bw,by); x.textAlign='left';
    rr(bx,by+12,bw,14,7); x.fillStyle=P.track; x.fill(); rr(bx,by+12,Math.max(14,bw*pctOf(v)/100),14,7); x.fillStyle=P.acc; x.fill(); by+=step; });
  font(800,36); x.fillStyle=P.acc; x.fillText(T.cardFoot,72,1278);
  font(550,26); x.fillStyle=P.sub; x.fillText(T.cardSmall,72,1318);

/* ═══ 진행 ═══ */
const AREA_FN={reason:aReason,verbal:aVerbal,dyn:aDyn,press:aPress,rule:aRule,learn:aLearn,seq:aSeq,rot:aRot,wm:aWm,speed:aSpeed,focus:aFocus};
function runArea(i){ if(!S) return; if(i>=FLOW.length) return endRecall(finishTest);
  setStep(i,tr('step',{i:i+1,n:T['n_'+FLOW[i]]})); clockStop(); AREA_FN[FLOW[i]](()=>{ clockStop(); runArea(i+1); }); }
function finishTest(){ const at=Date.now(); S.raw.ms=Math.round(now()-S.t0); S.raw.lang=L; if(FAST) S.raw.fast=F;
  const res=build(S.raw,at,S.pairs); S.res=res; const o=S;
  const q=root.querySelector('.cg-quit'); if(q){ q.classList.add('cg-off'); } const l=root.querySelector('.cg-steplab'); if(l) l.textContent=T.title;
  main(resultHTML(res,{primary:T.pick,share:typeof o.onShare==='function'})); bindRefs();

  const sb=$1('[data-share]'); if(sb) sb.onclick=()=>doShare(res,o.onShare); }
function startScreen(){ const rows=FLOW.map((a,i)=>`<div class="cg-prow"><div class="cg-num">${i+1}</div><div><b>${T['n_'+a]}</b><span>${T['d_'+a]}</span></div><i>${T['t_'+a]}</i></div>`).join('');
  main(`<section data-screen="start" class="cg-anim">${HERO}<h1 class="cg-title" tabindex="-1" data-focus>${T.title}</h1><p class="cg-tagline">${T.tagline}</p><p class="cg-lead">${T.lead}</p><p class="cg-basis">${T.basis}</p>
    <div class="cg-card cg-plan">${rows}<div class="cg-prow"><div class="cg-num">+</div><div><b>${T.n_end}</b><span>${T.d_end}</span></div><i>${T.t_end}</i></div></div>${refsHTML()}

  $1('[data-later]').onclick=()=>{ const cb=S&&S.onCancel; closeOverlay(); if(cb) cb(); };

/* ═══ 공개 API ═══ */
function start(opts){ opts=opts||{}; setLang(); FAST=!!opts.fast; F=FAST?(typeof opts.fast==='number'?opts.fast:0.1):1;

function recallDue(result){ try{ const r=result&&result.recall; return !!(r&&!r.done&&Array.isArray(r.pairs)&&r.pairs.length&&Date.now()-result.at>=RECALL_AFTER&&Date.now()>=(r.dueAt||0)); }catch(e){ return false; } }
function recall(result,opts){ opts=opts||{}; setLang(); FAST=!!opts.fast; F=FAST?(typeof opts.fast==='number'?opts.fast:0.1):1;
  if(!result||!result.recall||!Array.isArray(result.recall.pairs)||!result.recall.pairs.length){ if(opts.onCancel) opts.onCancel(); return; }
  openOverlay('recall'); S={onClose:opts.onCancel,step:null};
  root.querySelector('.cg-steplab').textContent=T.n_keep;
  const pairs=result.recall.pairs, words=pairs.map(p=>p.w).sort();
  main(`<section data-screen="recall-intro" class="cg-anim"><div class="cg-icon" style="background:var(--dopsoft);color:var(--dop)">${IC.learn}</div><h2 class="cg-h" tabindex="-1" data-focus>${T.rcH}</h2><p class="cg-p">${T.rcP}</p>
    <div class="cg-dock"><button class="cg-btn" data-next>${T.start}</button><button class="cg-ghost" data-a="close">${T.rcLater}</button></div></section>`);
  $1('[data-next]').onclick=()=>{ const order=shuffle(pairs.map((_,i)=>i)); let j=0,c=0; const t0=now();

    const fin=()=>{ const r=clone(result); r.raw=r.raw||{}; r.raw.keep={n:c,of:pairs.length,ms:Math.round(now()-t0),at:Date.now()};
      try{ const s=score(r.raw); r.areas=s.areas; r.type=s.type; }catch(e){ r.areas=r.areas||{}; r.areas.keep=toS((c-NORM.keep.m)/NORM.keep.sd); }
      r.recall.done=true;
      main(`<section data-screen="recall-done" class="cg-card cg-ready cg-anim" style="margin-top:18px"><div class="cg-big" style="color:var(--dop)">${c}<span style="font-size:1.125rem;color:var(--sub)"> / ${pairs.length}</span></div>
        <h2 class="cg-h" tabindex="-1" data-focus>${T.rcDone}</h2><p class="cg-p">${T.rcDoneP}</p>
        <div class="cg-arow keep" style="text-align:left"><div class="cg-an"><b>${T.n_keep}</b></div><div class="cg-av">${T[lvlOf(r.areas.keep)]}</div><div class="cg-trk"><i style="width:${pctOf(r.areas.keep)}%"></i><u style="left:${pctOf(100)}%"></u></div></div>
        <div class="cg-stack"><button class="cg-btn" data-next>${T.rcFinish}</button></div></section>`);
      $1('[data-next]').onclick=()=>{ const cb=opts.onDone; closeOverlay(); if(cb) cb(r); }; };
    q(); }; }

return {start,showResult,shareCard,recallDue,recall};
})();

    ko:{title:'라이벌로그 학습능력 체크',facts:['약 20~25분','과제 8개','로그인 없음'],lqLab:'학습지수',sub:'시험판 · 지능검사가 아닙니다 · 내가 보내기를 누르지 않으면 결과는 어디에도 보내지지 않아요',howH:'진행 방법',

      start:'검사 시작',resH:T1?'결과 기록':'내 결과',show:'결과 화면 다시 보기',copy:'기록 복사',copied:'복사했어요',note:'100은 라이벌로그의 잠정 기준점이에요. 비교 자료가 적어 점수표는 잠정이에요.',share:'공유하기',shared:'공유 문구를 복사했어요',shareNA:'아래 문구를 길게 눌러 복사해 주세요',close:'닫기',typeL:'나의 학습 유형',shareT:'나의 학습 유형은 「{t}」 · 라이벌로그 학습능력 체크(추정 · 지능검사 아님)\n나도 해 보기 hiarche.com/lab/lq2-test.html',app:'이 결과로 만든 라이벌과 공부 계획을 겨루는 앱, 라이벌로그 — 곧 나와요',appBtn:'라이벌로그 보기',cl:{h:'익명으로 검사 기준 만들기에 참여할까요? (선택)',lead:'아르케는 누가 보냈는지 알 수 없어요. 보낸 기록은 LQ 기준점(100)과 점수표를 만드는 통계로만 써요.',
      list:['보내는 것: LQ·영역 점수, 문항별 응답(정답 여부, 걸린 시간, 고른 확신도 — 확실해요·반반·찍었어요), 언어, 화면 종류(휴대폰/PC), 보낸 날짜, 들어온 경로(예: 카카오톡), 나이대·성별(고른 경우만)','보내지 않는 것: 이름·연락처·이메일·쿠키·기기 번호. 아르케는 IP 주소를 저장하지 않아요. 다만 저장소 업체(Supabase, 서버 위치 서울)가 보안을 위해 접속 기록(IP 주소 포함)을 1일 동안 남길 수 있어요.','보관: 기준표를 만든 뒤 2년, 늦어도 수집 시작일부터 3년 안에 지워요.','보내지 않아도 검사와 결과는 그대로 쓸 수 있어요. 보내지 않을 권리가 있어요.','누가 보냈는지 알 수 없게 저장하므로, 보낸 뒤에는 골라서 지울 수 없어요.','만 14세 미만은 보낼 수 없어요(검사와 결과 보기는 누구나 할 수 있어요).'],
      ageL:'나이대(선택)',age:[['u19','14~18'],['u30','19~29'],['30s','30대'],['40s','40대'],['50s','50대'],['60+','60 이상'],['na','밝히지 않음']],
      genL:'성별(선택)',gen:[['m','남'],['f','여'],['na','밝히지 않음']],
      adult:'만 14세 이상이에요(필수)',agree:'위 내용을 읽고 보내는 데 동의해요(필수)',send:'보내기',sending:'보내는 중…',ok:'보냈어요. 기준을 만드는 데 쓸게요. 고마워요.',err:'보내지 못했어요. 잠시 뒤 다시 눌러 주세요.',full:'오늘 받을 수 있는 기록이 다 찼어요. 내일 다시 보내 주세요.'},
    l3c:"이 사이트는 쿠키나 분석 도구를 쓰지 않아요. LQ 검사 결과는 브라우저 안에서만 계산돼요. 이용자가 결과 화면에서 직접 동의하고 보내기를 누른 경우에만 LQ 기록(LQ·영역 점수, 문항별 응답(정답 여부·걸린 시간·확신도), 언어, 화면 종류, 보낸 날짜, 들어온 경로, 고른 경우 나이대·성별)이 아르케의 저장소(Supabase Inc., 서버 위치 대한민국 서울 — 처리 위탁)로 전송돼요. 사이트를 열면 호스팅 업체 Vercel Inc.(미국)가 보안과 운영을 위해 접속 기록(IP 주소, 접속 시각, 브라우저 정보)을 미국 등 국외에서 Vercel의 정책에 따른 기간 동안 처리할 수 있어요. 저장소 업체 Supabase도 보안을 위해 접속 기록(IP 주소 포함)을 1일 동안 남길 수 있어요. 아르케는 이 기록들을 받거나 LQ 기록과 연결하지 않아요. 국외 처리를 원하지 않으면 이 사이트에 접속하지 않으면 돼요. 문의: 아르케 개인정보 보호 담당 · archeisit@gmail.com",l1:'점수는 연구에서 쓰는 과제 방식을 바탕으로 라이벌로그가 정한 잠정 기준으로 계산한 추정이에요. 지능검사나 진단이 아니에요.',l2:'결과 화면에 인용한 연구자·기관이 이 검사를 검토·보증한 것은 아니에요.',l3:'이 페이지는 쿠키나 분석 도구를 쓰지 않으며, 검사 답과 결과는 이 브라우저 화면에서만 계산되고 저장·전송되지 않아요. 다만 사이트를 호스팅하는 업체가 보안을 위해 접속 기록(IP 주소 등)을 남길 수 있어요.',

    en:{title:'Rivalog Learning Skills Check',facts:['20–25 min','8 tasks','No sign-up'],lqLab:'Learning quotient',sub:'Trial version · not an intelligence test · your result is sent nowhere unless you press Send',howH:'How it works',
      how:['Eight tasks in a row (about 20–25 minutes). Each starts with instructions and a practice item; most main rounds are timed.','Some tasks have a time limit. Look and answer right away.',"In Find the rule and Word logic, tap 'Sure · 50/50 · Guessed' after each answer.",(T1?'At the end you see your result, and a result record appears below on this page. Copy it and send it on.':'At the end you see your result, and it also stays below on this page (on this screen only).'),'When you finish, you can choose to send your record anonymously to help build the test baseline. We never ask for your name or contact details, and we can\'t tell who sent what. You\'ll see your result either way.'],
      start:'Start',resH:T1?'Result record':'My result',show:'Show result screen again',copy:'Copy record',copied:'Copied',note:"100 is Rivalog's provisional baseline. Comparison data is limited, so the score table is provisional.",share:'Share',shared:'Share text copied',shareNA:'Press and hold the text below to copy it',close:'Close',typeL:'My learning style',shareT:'My learning style: "{t}" · Rivalog learning skills check (an estimate, not an intelligence test)\nTry it: hiarche.com/lab/lq2-test-en.html',app:'Rivalog, the app where you race this rival with your study plan, is coming soon',appBtn:'See Rivalog',cl:{h:'Help build the test baseline anonymously? (optional)',lead:'Arche cannot tell who sent a record. Records are used only as statistics to set the LQ baseline (100) and score table.',
      list:['We send: LQ and area scores, per-item responses (right/wrong, time taken, and the confidence you chose — Sure / 50/50 / Guessed), language, device type (phone/PC), date sent, how you arrived (e.g. KakaoTalk), and age band and gender only if you choose them','We don\'t send: name, contact details, email, cookies or device IDs. Arche does not store IP addresses. Our storage provider (Supabase, servers in Seoul) may keep access logs, including IP addresses, for 1 day for security.','Kept for 2 years after the baseline is built, and deleted within 3 years of the start of collection at the latest.','You can still use the test and your result if you don\'t send. You have the right not to send.','Because we can\'t tell who sent what, individual records can\'t be deleted after sending.'],
      ageL:'Age band (optional)',age:[['u30','18–29'],['30s','30s'],['40s','40s'],['50s','50s'],['60+','60+'],['na','Prefer not to say']],
      genL:'Gender (optional)',gen:[['m','Male'],['f','Female'],['na','Prefer not to say']],
      adult:'I am 18 or older (required)',agree:'I have read this and agree to send (required)',send:'Send',sending:'Sending…',ok:'Sent. We\'ll use it to build the baseline. Thank you.',err:'Could not send. Please try again in a moment.',full:'Today\'s record limit is full. Please send again tomorrow.'},
    l3c:"This site uses no cookies or analytics. LQ results are calculated only in your browser. Only if you agree and press Send on the result screen is your LQ record (LQ and area scores, per-item responses (right/wrong, time taken and confidence), language, device type, date sent, how you arrived, and age band and gender if you chose them) sent to Arche's storage (Supabase Inc., servers in Seoul, Republic of Korea, acting as our processor). When you open this site, our hosting provider Vercel Inc. (USA) may process access logs (IP address, access time, browser information) for security and operation, in the US or other countries, for the period set by Vercel's own policy. Our storage provider Supabase may also keep access logs, including IP addresses, for 1 day for security. Arche does not receive these logs or link them to LQ records. If you do not want this processing abroad, please do not visit this site. Contact: Arche privacy team · archeisit@gmail.com",l1:'Scores are estimates based on task types used in research, on a provisional baseline set by Rivalog. This is not an intelligence test or a diagnosis.',l2:'Researchers and institutions cited on the result screen have not reviewed or endorsed this check.',l3:'This page uses no cookies or analytics. Your answers and results are calculated only in this browser and are not stored or sent. Our hosting provider may keep access logs (such as IP addresses) for security.',
      areas:{reason:'Find the rule',verbal:'Word logic',wm:'Count and remember',learn:'Pair memory',rot:'Turn the shape',keep:'Memory kept',meta:'Knowing what you know',dyn:'Learn from hints',press:'Time pressure',focus:'Hold back on 3'},
      lab:{lq:'LQ',range:'Range',type:'Type',time:'Time taken',min:'min',none:'not measured'}},
    ja:{title:'Rivalog 学習スキルチェック',facts:['約20〜25分','課題8つ','ログイン不要'],lqLab:'学習指数',sub:'試験版 · 知能検査ではありません · 「送信」を押さない限り、結果はどこにも送られません',howH:'進め方',
      how:['8つの課題に順番に取り組みます(約20〜25分)。各課題の最初に説明と練習問題があり、本番の問題はほとんど制限時間があります。','制限時間のある課題があります。画面を見て、すぐに判断して選んでください。','「ルールを見つける」「ことばの関係」では、答えを選んだあとに「自信あり・半々・勘で選んだ」のどれかを押します。',(T1?'終わると結果画面が出て、このページの下に結果の記録ができます。記録をコピーして送ってください。':'終わると結果画面が出て、このページの下にも結果が残ります(この画面だけ)。'),'チェックが終わったら、希望する方だけ匿名で記録を送り、チェックの基準づくりに参加できます。名前や連絡先は受け取らず、誰が送ったかはわかりません。送らなくても結果はそのまま見られます。'],
      start:'チェック開始',resH:T1?'結果の記録':'あなたの結果',show:'結果画面をもう一度見る',copy:'記録をコピー',copied:'コピーしました',note:'100はRivalogの暫定の基準点です。比較できるデータがまだ少ないため、点数表も暫定です。',share:'シェアする',shared:'シェア用の文をコピーしました',shareNA:'下の文を長押ししてコピーしてください',close:'閉じる',typeL:'あなたの学習タイプ',shareT:'私の学習タイプは「{t}」 · Rivalog 学習スキルチェック(推定・知能検査ではありません)\nやってみる hiarche.com/lab/lq2-test-ja.html',app:'この結果で作ったライバルと勉強の計画を競うアプリ、Rivalog — もうすぐ登場',appBtn:'Rivalogを見る',cl:{h:'匿名でチェックの基準づくりに参加しますか?(任意)',lead:'アルケ(Arche)には、誰が送ったかはわかりません。送られた記録は、チェックの基準点(100)と点数表の作成のためにのみ、統計として使います。',
      list:['送るもの:LQ・領域ごとの点数、問題ごとの正解かどうかとかかった時間、言語、画面の種類(スマホ/PC)、送信日、どこから来たか(例:LINE)、年代・性別(選んだ場合のみ)','送らないもの:名前・連絡先・メールアドレス・Cookie・端末の識別番号。アルケはIPアドレスを保存しません。ただし、保存先の事業者(Supabase、サーバーの所在地:韓国・ソウル)がセキュリティのため、アクセス記録(IPアドレスを含む)を1日間残すことがあります。','保存先:Supabase(大韓民国ソウル)、ホスティング:Vercel(米国)','保存期間:基準表をつくった後2年、遅くとも収集開始日から3年以内に削除します。','送らなくても、チェックと結果はそのまま使えます。送らない権利があります。','誰が送ったかわからない形で保存するため、送った後に個別に選んで削除することはできません。'],
      ageL:'年代(任意)',age:[['u30','18〜29歳'],['30s','30代'],['40s','40代'],['50s','50代'],['60+','60歳以上'],['na','答えない']],
      genL:'性別(任意)',gen:[['m','男性'],['f','女性'],['na','答えない']],
      adult:'18歳以上です(必須)',agree:'上の内容を読み、送ることに同意します(必須)',send:'送信',sending:'送信中…',ok:'送信しました。基準づくりに使わせていただきます。ありがとうございました。',err:'送信できませんでした。少し時間をおいて、もう一度押してください。',full:'今日受け付けられる記録の数がいっぱいになりました。明日もう一度送ってください。'},
    l3c:'このサイトはCookieや分析ツールを使いません。LQチェックの結果はブラウザの中だけで計算されます。利用者が結果画面で同意し「送信」を押した場合にのみ、LQの記録(LQ・領域ごとの点数、問題ごとの正解かどうか・かかった時間、言語、画面の種類、送信日、どこから来たか、選んだ場合は年代・性別)がアルケの保存先(Supabase Inc.、サーバーの所在地:大韓民国ソウル — 取扱いの委託)へ送られます。このサイトを開くと、ホスティング事業者のVercel Inc.(米国)がセキュリティと運営のため、アクセス記録(IPアドレス、アクセス時刻、ブラウザ情報)を米国などの国外で、Vercelのポリシーで定める期間取り扱うことがあります。保存先の事業者Supabaseも、セキュリティのためアクセス記録(IPアドレスを含む)を1日間残すことがあります。アルケはこれらの記録を受け取らず、LQの記録と結びつけることもありません。国外での取扱いを望まない場合は、このサイトにアクセスしないでください。お問い合わせ:個人情報保護担当(Arche)· archeisit@gmail.com',l1:'点数は、研究で使われている課題の形式をもとに、Rivalogが定めた暫定の基準で計算した推定です。知能検査や診断ではありません。',l2:'結果画面で引用している研究者・機関が、このチェックを検討・保証したものではありません。',l3:'このページはCookieや分析ツールを使いません。回答と結果はこのブラウザの画面の中だけで計算され、保存・送信されません。ただし、サイトのホスティング事業者がセキュリティのためアクセス記録(IPアドレスなど)を残すことがあります。',
      areas:{reason:'ルールを見つける',verbal:'ことばの関係',wm:'計算しながら記憶',learn:'ペア記憶',rot:'図形を回す',keep:'記憶の保持',meta:'わかっているかを知る力',dyn:'ヒントで学ぶ',press:'時間のプレッシャー',focus:'3だけ押さない'},
      lab:{lq:'LQ',range:'範囲',type:'タイプ',time:'かかった時間',min:'分',none:'測定なし'}}};
  let lang=Q.get('lang')==='en'?'en':Q.get('lang')==='ko'?'ko':'ja', last=null; const hist=[];
  const apply=()=>{ const t=TX[lang]; window.LANG=lang; document.documentElement.lang=lang;
    $('tTitle').textContent=t.title; $('tSub').textContent=t.sub; $('tHowH').textContent=t.howH;
    $('tHow').innerHTML=t.how.map(s=>'<li>'+s.replace(/</g,'&lt;')+'</li>').join('');
    $('bStart').textContent=t.start; $('tResH').textContent=t.resH; $('bShow').textContent=t.show; $('bCopy').textContent=t.copy; $('tNote').textContent=t.note;
    $('bShare').textContent=t.share; $('tLqLab').textContent=t.lqLab; t.facts.forEach((x,i)=>{ $('f'+i).textContent=x; }); $('tApp').textContent=t.app; $('aApp').textContent=t.appBtn; $('aApp').href='https://hiarche.com/apps/rivalog.html'+(lang==='ko'?'':'?lang='+lang);
    $('tL1').textContent=t.l1; $('tLMore').textContent=(lang==='ko'?'개인정보·안내 더 보기':lang==='ja'?'個人情報・ご案内をもっと見る':'Privacy and notes'); $('tL2').textContent=t.l2; $('tL3').textContent=(COLLECT_ON?t.l3c:t.l3); if(COLLECT_ON){ if(window.__clLang!==lang){ $('clAdult').checked=false; $('clAgree').checked=false; $('clSend').disabled=true; window.__clLang=lang; } clText(); } $('bCopy').hidden=!T1; $('out').hidden=!T1;
    $('bKo').classList.toggle('on',lang==='ko'); $('bEn').classList.toggle('on',lang==='en'); $('bJa').classList.toggle('on',lang==='ja'); if(last) render(last); };
  const render=r=>{ const t=TX[lang], A=r.areas||{};
    $('res').hidden=false; $('app').hidden=false; if(COLLECT_ON) clShow(r); $('lq').textContent=t.lab.lq+' '+r.lq;
    $('tTypeL').textContent=t.typeL; $('tType').textContent=(((r.type||{})[lang])||((r.type||{}).code)||'-');
    const ty=r.type||{}; const rows=[
      t.lab.lq+': '+r.lq+'  ('+t.lab.range+' '+r.idx.lo+'–'+r.idx.hi+')',
      t.lab.type+': '+(ty[lang]||ty.code||'-'),
      t.lab.time+': '+((r.raw&&r.raw.ms||0)/60000).toFixed(1)+' '+t.lab.min,'' ];
    for(const k in t.areas) if(k in A) rows.push(t.areas[k]+': '+(A[k]==null?t.lab.none:A[k]));
    const raw=JSON.parse(JSON.stringify(r,(k,v)=>k==='pairs'?undefined:v));
    $('out').value=rows.join('\n')+'\n\n--- raw ---\n'+JSON.stringify(raw); };
  const toast=s=>{ $('toast').textContent=s; clearTimeout(toast.t); toast.t=setTimeout(()=>$('toast').textContent='',2500); };
  const shareMsg=()=>{ const t=TX[lang], ty=(last&&last.type)||{}; return t.shareT.replace('{t}',ty[lang]||ty.code||'-'); };
  const onShare=()=>{ const t=TX[lang], msg=shareMsg();
    const manual=()=>{ $('tSheet').textContent=t.shareNA; $('shareBox').value=msg; $('bSheet').textContent=t.close; $('sheet').hidden=false; try{ $('shareBox').focus(); $('shareBox').select(); }catch(e){} };
    const copy=()=>{ try{ navigator.clipboard.writeText(msg).then(()=>toast(t.shared),manual); }catch(e){ manual(); } };
    try{ if(navigator.share){ navigator.share({text:msg}).catch(e=>{ if(!e||e.name!=='AbortError') copy(); }); return; } }catch(e){}
    copy(); };
  // ── 익명 기록 보내기(동의한 경우에만 1회) ──
  const SRC_OK=['direct','kakao','threads','instagram','x','youtube','disquiet','community','reddit','surveycircle','panel','test','other'];
  const srcOf=()=>{ if(T1) return 'test'; const v=(Q.get('src')||'').toLowerCase(); if(!v) return 'direct'; return SRC_OK.includes(v)?v:'other'; };
  const devOf=()=>{ try{ return matchMedia('(pointer:coarse)').matches?'phone':'pc'; }catch(e){ return 'pc'; } };
  const sec=ms=>ms==null?null:Math.round(ms/100)/10;
  const sentSet=new WeakSet(); let clFor=null, clBusy=false;
  const pick=n=>{ const x=document.querySelector('input[name="'+n+'"]:checked'); return x?x.value:null; };
  const opts=(box,name,list,cur)=>{ box.replaceChildren(); list.forEach(([v,l])=>{ const lb=document.createElement('label'); const i=document.createElement('input'); i.type='radio'; i.name=name; i.value=v; if(cur===v) i.checked=true; const sp=document.createElement('span'); sp.textContent=l; lb.append(i,sp); box.append(lb); }); };
  const clText=()=>{ const c=TX[lang].cl, a=pick('clAge'), g=pick('clGen');
    $('clH').textContent=c.h; $('clLead').textContent=c.lead; $('clList').replaceChildren(...c.list.map(s=>{ const li=document.createElement('li'); li.textContent=s; return li; }));
    $('clAgeL').textContent=c.ageL; $('clGenL').textContent=c.genL; opts($('clAgeO'),'clAge',c.age,a); opts($('clGenO'),'clGen',c.gen,g);
    $('clAdultT').textContent=c.adult; $('clAgreeT').textContent=c.agree; if(!clBusy) $('clSend').textContent=c.send; };
  const clGate=()=>{ $('clSend').disabled=clBusy||!($('clAdult').checked&&$('clAgree').checked); };
  const clShow=r=>{ clFor=r; const sent=sentSet.has(r); $('cl').hidden=false; $('clMsg').textContent=sent?TX[lang].cl.ok:'';
    ['clAge','clGen'].forEach(id=>$(id).hidden=sent); ['clAdult','clAgree'].forEach(id=>{ $(id).closest('label').hidden=sent; if(!sent) $(id).checked=false; }); $('clSend').closest('.row').hidden=sent; clGate(); };
  const itemsOf=r=>{ const R=r.raw||{}, out=[];
    ((R.reason&&R.reason.items)||[]).forEach(x=>out.push({k:'r'+x[0],lv:x[1],ok:x[2],t:sec(x[3])}));
    ((R.verbal&&R.verbal.items)||[]).forEach(x=>out.push({k:'v',lv:x[0],ok:x[1],t:sec(x[2])}));
    if(R.wm) out.push({k:'wm',right:R.wm.right,total:R.wm.total,eq:R.wm.eqAcc,sets:R.wm.sets});
    if(R.learn) out.push({k:'learn',rounds:R.learn.rounds,end:R.learn.end});
    if(R.rot) out.push({k:'rot',right:R.rot.right,n:R.rot.n,rt:sec(R.rot.rt)});
    if(R.dyn) out.push({k:'dyn',pre:R.dyn.pre,post:R.dyn.post,n:R.dyn.n,hints:R.dyn.hints,fixed:R.dyn.fixed,wrongPre:R.dyn.wrongPre});
    if(R.press) out.push({k:'press',calm:{acc:R.press.calm.acc,rt:sec(R.press.calm.rt),late:R.press.calm.late},hot:{acc:R.press.hot.acc,rt:sec(R.press.hot.rt),late:R.press.hot.late}});
    if(R.focus) out.push({k:'focus',nogo:R.focus.nogo,com:R.focus.com,go:R.focus.go,om:R.focus.om,rt:R.focus.rt,cv:R.focus.cv});
    out.push({k:'all',t:sec(R.ms)}); return out; };
  const clSend=async()=>{ const r=clFor, c=TX[lang].cl; if(!r||sentSet.has(r)||clBusy) return; if(!($('clAdult').checked&&$('clAgree').checked)) return;
    const areas={}; Object.keys(r.areas||{}).forEach(k=>{ const v=r.areas[k]; areas[k]=(typeof v==='number')?Math.round(v):null; });
    const body={ver:'lq2.0',lang:lang,device:devOf(),src:srcOf(),age_band:pick('clAge'),gender:pick('clGen'),adult:true,consent:true,consent_v:(lang==='ko'?'ko-20261020-a14':lang+'-20261020'),lq:Math.round(r.lq),areas:areas,items:itemsOf(r)};
    clBusy=true; clGate(); $('clSend').textContent=c.sending; $('clMsg').textContent='';
    try{ const res=await fetch('https://cvuyarvywlkvxwfckqjb.supabase.co/rest/v1/lq_records',{method:'POST',headers:{'apikey':'sb_publishable_Z04lS5iGlcrsF605w-oyKA_kXf5DOBA','Authorization':'Bearer sb_publishable_Z04lS5iGlcrsF605w-oyKA_kXf5DOBA','Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body),credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});
      if(res.ok){ sentSet.add(r); clBusy=false; clShow(r); return; }
      let full=false; try{ full=/daily limit/.test(await res.text()); }catch(e){}
      $('clMsg').textContent=full?c.full:c.err;
    }catch(e){ $('clMsg').textContent=c.err; }
    clBusy=false; $('clSend').textContent=c.send; clGate(); };
  $('clAdult').onchange=clGate; $('clAgree').onchange=clGate; $('clSend').onclick=clSend;
  $('bShare').onclick=onShare; $('bSheet').onclick=()=>{ $('sheet').hidden=true; };
  $('bJa').onclick=()=>{ lang='ja'; apply(); };
  $('bKo').onclick=()=>{ lang='ko'; apply(); }; $('bEn').onclick=()=>{ lang='en'; apply(); };
  $('bTheme').onclick=()=>{ const d=document.documentElement; d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'; };
  $('bStart').onclick=()=>{ window.LANG=lang; Cog.start({fast:false,onShare,onDone:r=>{ if(last) hist.push(last); last=r; render(r); $('res').scrollIntoView(); },onCancel:()=>{}}); };
  $('bShow').onclick=()=>{ if(last) Cog.showResult(last,{history:hist.concat([last]),onShare,onClose:()=>{}}); };
  $('bCopy').onclick=()=>{ const o=$('out'); o.select(); const done=()=>{ $('bCopy').textContent=TX[lang].copied; setTimeout(()=>$('bCopy').textContent=TX[lang].copy,1500); };
    try{ navigator.clipboard.writeText(o.value).then(done,()=>{ document.execCommand('copy'); done(); }); }catch(e){ try{ document.execCommand('copy'); done(); }catch(_){} } };
  apply();
})();
</script>
