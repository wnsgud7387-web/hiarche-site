<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>라이벌로그 웹판 운영 종료</title>
<style>
:root{--bg:#f7f5f0;--fg:#1f2a27;--muted:#5d6a66;--card:#fff;--line:#e3ddd2;--accent:#2f4a43}
@media (prefers-color-scheme:dark){:root{--bg:#141a18;--fg:#eef2ef;--muted:#a9b5b0;--card:#1d2522;--line:#2c3733;--accent:#9cc7b8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:20px}
h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;color:var(--muted)}
a.btn,button{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
small{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>라이벌로그 웹판은 운영을 마쳤어요</h1>
<p>그동안 웹에서 라이벌로그를 써 주셔서 고맙습니다. 라이벌로그는 이제 앱에서만 만날 수 있어요.</p>
<div class="card">
<b>앱으로 이어서 쓰기</b>
<p>안드로이드: Google Play에서 '라이벌로그'를 검색하거나 아래 단추를 누르세요.</p>
<a class="btn" href="https://play.google.com/store/apps/details?id=com.arche.rivalog" rel="noopener">Google Play에서 보기</a>
</div>
<div class="card">
<b>이 브라우저에 남은 내 기록</b>
<p>웹판에서 쓴 계획과 기록은 서버가 아니라 이 브라우저에만 저장돼 있어요. 필요하면 파일로 내려받아 보관하세요.</p>
<button id="dl" type="button">내 기록 내려받기</button>
<p id="msg" aria-live="polite"></p>
</div>
<p style="margin-top:24px"><small>ARCHE · 문의 archeisit@gmail.com · 0502-1921-1532 · <a href="https://hiarche.com/" style="color:inherit">hiarche.com</a></small></p>
</main>
<script>
document.getElementById('dl').addEventListener('click',function(){
  var m=document.getElementById('msg'),o={};
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);o[k]=localStorage.getItem(k);}}catch(e){m.textContent='이 브라우저에서는 기록을 읽을 수 없어요.';return;}
  if(!Object.keys(o).length){m.textContent='이 브라우저에는 남은 기록이 없어요.';return;}
  var b=new Blob([JSON.stringify({app:'rivalog-web',exported:new Date().toISOString(),data:o},null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rivalog-web-backup.json';document.body.appendChild(a);a.click();a.remove();
  m.textContent='내려받았어요.';
});
</script>
</body>
</html>
