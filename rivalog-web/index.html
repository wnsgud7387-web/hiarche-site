<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<!-- 라이벌로그 앱 화면 원본 (Lueur팀장 · 2026-10-15 v2 디자인).
     출발: 비서 시제품 v3(proto/doppel_proto.html) — 계산식은 그대로, 바꾼 것: 라이벌 105% · FSRS 망각 곡선 · 복습 기준 80% ·
     처음 안내 · 한국어/영어(기기 언어) · v2 디자인(아래 탭 3개: 오늘·단원·책 / 경주 트랙 / 오늘 목표 고리 / 연속 기록).
     디자인 참고: Structured(한 화면 한 일, 차분함) · Strava 고스트 경주(앞섬·접전·뒤처짐 상태) · Duolingo(하루 목표·연속 기록).
     tool/sync_web.py 가 이 파일을 assets/web/index.html 로 옮긴다(저장 다리 넣기 · 바깥 주소 검사). -->
<title>라이벌로그 — 1회독 계획과 라이벌</title>
<style>
/* 라이벌로그 디자인 파일 — tokens.css
   색 토큰(밝음·어두움). 값을 바꾸면 그 색을 쓰는 모든 화면이 바뀐다.
   assets/web/index.html 의 /*ARCHE_DESIGN*\/ 자리에 앱(lib/main.dart)이 tokens → components 순서로 끼워 넣는다.
   고치는 법은 저장소 맨 위 DESIGN_EDIT.md. */
:root{--amberink:#8a5a0b;--dopink:#6a4fb0;--bg:#f4f1ea;--card:#fffdf8;--ink:#1d1b17;--sub:#6b6458;--line:#e5dfd2;--track:#ece6d9;--acc:#2f5d50;--accsoft:#e3ede8;--dop:#7a5cc4;--dopsoft:#efe9fb;--amber:#c98a1b;--ambersoft:#fbf1dc;--warn:#b5482b;--warnsoft:#f8e4dd;--shadow:0 1px 2px rgba(40,30,10,.05),0 4px 16px rgba(40,30,10,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141310;--card:#1d1c18;--ink:#ece6da;--sub:#a39a8a;--line:#33302a;--track:#2a2823;--acc:#7fbfa9;--accsoft:#1f2b26;--dop:#b39cf0;--dopsoft:#25203a;--amber:#e5b04e;--ambersoft:#2e2614;--warn:#e07a5f;--warnsoft:#33211c;--amberink:#e5b04e;--dopink:#b39cf0;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141310;--card:#1d1c18;--ink:#ece6da;--sub:#a39a8a;--line:#33302a;--track:#2a2823;--acc:#7fbfa9;--accsoft:#1f2b26;--dop:#b39cf0;--dopsoft:#25203a;--amber:#e5b04e;--ambersoft:#2e2614;--warn:#e07a5f;--warnsoft:#33211c;--amberink:#e5b04e;--dopink:#b39cf0;--shadow:none;color-scheme:dark}
:root{--fieldline:#8f8778}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fieldline:#757062}}
:root[data-theme="dark"]{--fieldline:#757062}

/* 라이벌로그 디자인 파일 — components.css
   모양 규칙(색·배경·테두리·모서리·그림자·글꼴·글자 간격·줄 간격·안쪽 여백·간격). 보이기/숨기기·위치·크기·애니메이션은 index.html 에 남아 있다.
   assets/web/index.html 의 /*ARCHE_DESIGN*\/ 자리에 앱(lib/main.dart)이 tokens → components 순서로 끼워 넣는다.
   고치는 법은 저장소 맨 위 DESIGN_EDIT.md. */
html,body{padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Noto Sans",system-ui,sans-serif;font-size:1rem;line-height:1.5}
button{font:inherit;border:0;border-radius:14px;padding:12px 16px;background:var(--acc);color:var(--card);font-weight:650}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:550}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.app{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
.top{gap:10px}
.top .date{font-size:0.875rem;color:var(--sub);font-weight:600;letter-spacing:.02em}
.top h1{font-size:1.75rem;letter-spacing:-.02em;line-height:1.15}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:0;font-weight:700;box-shadow:var(--shadow)}
.view{gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.label{font-size:0.75rem;color:var(--sub);font-weight:600;letter-spacing:.03em}
.muted{color:var(--sub);font-size:0.875rem}
.books{gap:6px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:0.875rem;font-weight:600}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
/* 경주 */
.race .state{gap:6px;font-size:0.75rem;font-weight:700;border-radius:999px;padding:4px 10px}
.state.ahead{background:var(--accsoft);color:var(--acc)}
.state.close{background:var(--ambersoft);color:var(--amberink)}
.state.behind{background:var(--dopsoft);color:var(--dopink)}
.race .msg{font-size:1.125rem;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.race .msg b{color:var(--acc)}
.race.behind .msg b{color:var(--dopink)}
.lane .rail{border-radius:999px;background:var(--track)}
.lane .done{border-radius:999px}
.lane.me .done{background:var(--acc)}
.lane.rv .done{background:var(--dop)}
.runner{border-radius:50%;font-size:0.75rem;font-weight:800;color:#fff;border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.lane.me .runner{background:var(--acc)}
.lane.rv .runner{background:var(--dop)}
.lanes{gap:4px}
.lname{font-size:0.75rem;color:var(--sub);font-weight:600}
.race .note{font-size:0.75rem;color:var(--sub)}
/* 오늘 목표 */
.goal{gap:16px}
.ring .num{line-height:1.1}
.ring .num b{font-size:1.75rem;letter-spacing:-.02em}
.ring .num span{font-size:0.75rem;color:var(--sub);font-weight:600}
.goal h2{font-size:1.125rem}
.streak{gap:4px;font-size:0.875rem;font-weight:700;color:var(--amberink)}
.quick{gap:6px}
.quick button{padding:10px 0;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:650}
.logrow{gap:8px}
.logrow button{padding:12px 14px}
.logrow input{padding:10px}
/* 숫자 칸 */
.stats{gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;box-shadow:var(--shadow)}
.stat b{font-size:1.125rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:0.75rem;color:var(--sub);font-weight:600}
.stat.rv b{color:var(--dopink)}
/* 다시 볼 단원 */
.due{gap:12px}
.due .dot{border-radius:50%;background:var(--warn)}
.due .t{font-weight:650}
.due button{padding:8px 12px;font-size:0.875rem}
/* 단원 탭 */
.legend{gap:12px;font-size:0.75rem;color:var(--sub);font-weight:600}
.legend i{border-radius:8px}
.urow2{gap:6px 12px;padding:14px 0;border-top:1px solid var(--line)}
.urow2:first-of-type{border-top:0}
.urow2 .n{font-weight:700}
.urow2 .meta{font-size:0.75rem;color:var(--sub)}
.urow2 .bar{border-radius:999px;background:var(--track)}
.urow2 .bar i{border-radius:999px}
.urow2 button{padding:8px 12px;font-size:0.875rem;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.c-fresh{background:var(--acc)}
.c-fade{background:var(--amber)}
.c-due{background:var(--warn)}
.c-none{background:var(--line)}
/* 책 탭 */
.bookcard h3{font-size:1rem}
.prog{border-radius:999px;background:var(--track)}
.prog i{background:var(--acc);border-radius:999px}
.row{gap:8px}
.badge{font-size:0.75rem;font-weight:700;color:var(--acc);background:var(--accsoft);border-radius:999px;padding:3px 8px}
.form{gap:12px}
.seg{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{background:transparent;color:var(--sub);padding:9px 0;border-radius:8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.grid2{gap:10px}
label{gap:5px;font-size:0.75rem;color:var(--sub);font-weight:600}
.urows{gap:6px}
.urow{gap:6px}
.urow button{padding:10px 0;background:transparent;color:var(--sub);border:1px solid var(--line)}
.foot{font-size:0.75rem;color:var(--sub)}
.todo{gap:12px;padding:12px 14px;border-radius:14px;background:var(--accsoft)}
.todo .rng{font-weight:700;font-size:1rem}
.todo button{padding:10px 14px}
.todo.done{background:var(--ambersoft)}
.todo.done .rng{color:var(--amberink);font-size:0.875rem}
.week{gap:6px}
.wcol{gap:4px}
.wbar{background:var(--track);border-radius:8px}
.wbar i{background:var(--acc);border-radius:8px}
.wcol.today .wbar i{background:var(--amber)}
.wv{font-size:0.75rem;color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums}
.wd{font-size:0.75rem;color:var(--sub);font-weight:600}
.empty{padding:30px 18px}
.empty h2{font-size:1.125rem}
/* 아래 탭 */
.tabbar{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabbar button{background:transparent;color:var(--sub);gap:2px;padding:6px 0;font-size:0.75rem;font-weight:650;border-radius:8px}
.tabbar button.on{color:var(--acc)}
/* 처음 안내 */
#intro{background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
#intro .skip{background:transparent;color:var(--sub);border:0;font-weight:550;padding:8px 4px}
#intro h2{font-size:1.75rem;line-height:1.35;letter-spacing:-.01em}
#intro p{font-size:1rem;line-height:1.65;color:var(--sub)}
#intro p b{color:var(--ink)}
#intro .dots{gap:8px}
#intro .dots i{border-radius:999px;background:var(--line)}
#intro .dots i.on{background:var(--acc)}
#intro .go{padding:15px;font-size:1rem;border-radius:14px}
#intro .note{font-size:0.75rem;color:var(--sub)}
/* 1.0 제출본: 결제 화면 · 라이벌 고르기 · 하루 시간 · 예측 */
.sm{padding:8px 12px;font-size:0.875rem}
.lnk{background:transparent;color:var(--acc);padding:6px 4px;font-weight:600;font-size:0.875rem;text-decoration:underline}
.links{gap:4px 14px}
.badge.plus{color:var(--dopink);background:var(--dopsoft)}
.alist{gap:6px}
.arow{gap:10px;font-size:0.875rem}
.arow .an{font-weight:650}
.over{color:var(--warn);font-weight:650;font-size:0.875rem}
.fcnums{gap:10px}
.fcnums div{background:var(--bg);border-radius:14px;padding:12px}
.fcnums b{font-size:1.75rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fcnums span{font-size:0.75rem;color:var(--sub);font-weight:600}
.fcnums .rvc b{color:var(--dopink)}
.fcnums.lock b{color:var(--line)}
.recall{gap:12px;background:var(--dopsoft);border-color:transparent}
.recall button{background:var(--dop)}
.rvsum{gap:10px;padding:12px;border-radius:14px;background:var(--bg)}
.ropts{gap:10px}
.ropt{gap:4px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:16px;font-weight:500}
.ropt.on{border-color:var(--dopink);background:var(--dopsoft)}
.ropt .rl{gap:8px}
.ropt .rl b{font-size:1rem}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--dopink)}
.find1{background:linear-gradient(160deg,var(--dopsoft),var(--card) 70%)}
#pay{background:var(--bg)}
.paybox{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.px{padding:0;border-radius:999px;background:var(--card);color:var(--sub);border:1px solid var(--line);font-size:1.125rem;line-height:1}
.ptop{padding-top:20px}
.ptop h2{font-size:1.75rem;letter-spacing:-.02em}
.preason{background:var(--ambersoft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:0.875rem}
.pfeat{padding:0;gap:12px}
.pfeat li{gap:10px}
.pfeat b{font-size:1rem}
.pfeat span{font-size:0.875rem;color:var(--sub)}
.popts{gap:8px}
.popt{gap:10px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px;font-weight:500}
.popt.on{border-color:var(--acc);background:var(--accsoft)}
.popt .pl{gap:2px}
.popt b{font-size:1rem}
.ps{font-size:0.75rem;color:var(--sub);font-weight:600}
.pbadge{font-size:0.75rem;font-weight:700;color:var(--card);background:var(--acc);border-radius:999px;padding:2px 8px}
.pgo{padding:15px;font-size:1rem;border-radius:14px}
.pna{padding:16px 4px}
.pmsg{color:var(--warn);font-size:0.875rem;font-weight:650}
.pdisc{font-size:0.75rem;color:var(--sub);line-height:1.55}
.plinks{gap:2px 12px}
.pbiz{font-size:0.75rem;color:var(--sub);line-height:1.55}
.pbiz .lnk{font-size:0.75rem;padding:0}
.week1{background:linear-gradient(160deg,var(--accsoft),var(--card) 75%)}
.wkgrid{gap:8px}
.wkgrid div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.wkgrid b{font-size:1.125rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wkgrid span{font-size:0.75rem;color:var(--sub);font-weight:600}
.stat span,.wkgrid span{line-height:1.3}
.hint{font-size:0.75rem}
.endc h2{font-size:1.125rem}
.logrow select{padding:10px 8px}
.gen{gap:6px}
.gen .muted{font-size:0.75rem}
.arow .sm{padding:6px 10px;font-size:0.75rem}
.okm{color:var(--acc);font-weight:800}
.arow{gap:8px}
.stat b{font-size:1.125rem}
.recall .ghost{color:var(--ink);border-color:var(--dopink)}
#toast .undo{background:transparent;color:var(--amberink);padding:0 0 0 8px;font-size:0.875rem;font-weight:800}
.pnote{background:var(--ambersoft);border-radius:14px;padding:12px 14px;font-size:0.875rem;font-weight:600;color:var(--ink)}
.lvrow{gap:8px}
.state.done{background:var(--ambersoft);color:var(--amberink)}
#toast{background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:0.875rem;font-weight:650;box-shadow:var(--shadow)}
/* 플래너 개편(10-19) */
.blks{gap:8px}
.blk{gap:6px}
.wdgrid{gap:5px!important}
.wdgrid .chip{padding:8px 0}
.blk input{padding:9px 8px}
.blk .bl{font-size:0.75rem}
.blk .sm{padding:0}
.wkdays{gap:4px}
.wkd{background:var(--accsoft);border-radius:8px;padding:8px 2px;gap:2px}
.wkd b{font-size:0.75rem}
.wkd span{font-size:0.75rem;color:var(--sub)}
.wkd.off{background:var(--track)}
.alrow{gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.alrow:first-child{border-top:0;padding-top:0}
.aln{gap:6px}
.alsub{font-size:0.875rem}
.alsum{padding-top:10px;border-top:1px solid var(--line);font-weight:650;font-size:0.875rem}
.alsum.over{color:var(--warn)}
details.calc{border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
details.calc summary{font-weight:650;font-size:0.875rem}
.focus{font-size:0.875rem;font-weight:600}
.focus .fbar{border-radius:999px;background:var(--track)}
.focus .fbar i{background:var(--dop);border-radius:999px}
.focus.rest .fbar i,.focus.gap .fbar i{background:var(--amber)}
.plan1 p{font-size:0.875rem}
/* 1.0.1 입력 단계 · 요일 켜짐 · 계산기 · 라이벌 코드 (대표님 10-19) */
.steps{gap:12px}
.sgrp{gap:12px}
.step{border:1.5px solid var(--line);border-radius:14px;padding:14px;gap:10px;background:var(--card)}
.step>.qh{gap:10px}
.step>.qh::before{border-radius:50%;background:var(--acc);color:var(--card);font-size:0.875rem;font-weight:800}
.qh .q{font-size:1rem;font-weight:750;color:var(--ink);line-height:1.35}
.qh .q small{font-size:0.875rem;font-weight:500;color:var(--sub);line-height:1.45}
.ex{font-size:0.875rem;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px 10px;line-height:1.5}
.ex b{color:var(--ink);font-weight:650}
.flab{font-size:0.875rem;color:var(--ink);font-weight:650}
.need{font-size:0.875rem;font-weight:650;color:var(--acc)}
.exl{padding-left:18px;color:var(--ink)}
.uopts{gap:8px}
.uopt{gap:2px 10px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font-weight:600}
.uopt::before{border-radius:50%;border:2px solid var(--sub)}
.uopt.on{border-color:var(--acc);background:var(--accsoft)}
.uopt.on::before{border:6px solid var(--acc)}
.uopt b{font-size:1rem}
.uopt span{font-size:0.875rem;color:var(--sub);font-weight:500}
.urow.pg{gap:6px}
.urows:has(.pg){gap:14px}
.urow.pg input[type=number]{padding:10px 4px}
.wdgrid .chip{padding:6px 0 7px;background:transparent;color:var(--sub);border:1.5px dashed var(--line);font-weight:600;line-height:1.25}
.wdgrid .chip::before{font-size:0.75rem;line-height:1.2}
.wdgrid .chip.on{background:var(--acc);color:var(--card);border:1.5px solid var(--acc);font-weight:750}
.wdlg{font-size:0.75rem}
.wdlg .lg{border-radius:8px;border:1.5px dashed var(--line);font-size:0.75rem}
.wdlg .lg.on{background:var(--acc);border:1.5px solid var(--acc);color:var(--card)}
.calc2{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;gap:10px}
.calc2 .q{font-size:1rem;font-weight:750;color:var(--ink);line-height:1.35}
.calc2 .q small{font-size:0.875rem;font-weight:500;color:var(--sub);line-height:1.45}
.calc2 input{background:var(--card)}
.cres{font-weight:750;font-size:1rem;color:var(--ink);background:var(--card);border-radius:8px;padding:10px 12px}
.cres.wait{font-weight:600;font-size:0.875rem;color:var(--sub)}
.uempty h2{font-size:1.125rem}
.swap{padding-top:12px;border-top:1px solid var(--line)}
.rcbox{gap:8px}
.rcbox textarea{font:inherit;font-size:0.875rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
/* 1.0.1 공부 시간 · 실제 기록 */
.tmv{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#tmGo.stop{background:var(--warn)}
.tman summary{font-size:0.875rem;color:var(--sub)}
.calnew{padding:12px;border-radius:14px;background:var(--dopsoft)}
.sync{gap:5px;padding:10px 12px;border-radius:14px;background:var(--dopsoft)}
.sync b{font-size:0.875rem}
.sybar{gap:4px}
.sybar i{border-radius:999px;background:var(--track)}

/* ── 디자인 검수 공통 규칙(디자인실장 10-19): 글자 6단계 rem · 모서리 8/14/999 · 누르는 영역 44 · 보라=라이벌 ── */

/* ─── ⑦ 숫자 3만 참기(지속 주의 반응 과제, Robertson 외 1997) ─── */
// 숫자 1~9가 250ms 보이고 900ms 가림(⊗) — 한 번에 1.15초. 3이 아니면 누르고 3이면 참는다. 글자 크기는 매번 달리(모양으로만 맞히지 않게).
function focusSeq(n){ const per=Math.round(n/9), a=[]; for(let d=1;d<=9;d++) for(let k=0;k<per;k++) a.push(d);
  for(let g=0;g<200;g++){ shuffle(a); let ok=true; for(let i=1;i<a.length;i++) if(a[i]===3&&a[i-1]===3){ ok=false; break; } if(ok) break; } return a; }
function aFocus(done){
  const screen=(name,prac)=>{ main(`<section data-screen="${name}">${prac?`<div class="cg-qhead"><span class="cg-tag">${T.practice}</span></div>`:''}
    <div class="cg-fstage mask" aria-live="off">⊗</div><button class="cg-ans cg-btn cg-tap">${T.tapBtn}</button><div class="cg-tally" role="status"></div><div class="cg-after"></div></section>`); };
  const play=(seq,prac,fin)=>{ const tr2=[]; let k=-1, t0=0; const st=$1('.cg-fstage'), btn=$1('.cg-tap'), sizes=[48,60,72,84,96];
    const step=()=>{ if(k>=0){ const r=tr2[k]; if(prac&&r){ const fb=$1('.cg-tally'); const good=r.d===3?!r.tap:r.tap; fb.textContent=good?T.ok:(r.d===3?'✕ 3':'✕'); fb.style.color=good?'var(--acc)':'var(--warn)'; } }
      k++; if(k>=seq.length){ btn.disabled=true; return fin(tr2); }

      later(()=>{ st.classList.add('mask'); st.textContent='⊗'; later(step,DUR.focusMask*F); },DUR.focusOn*F); };
    const press=()=>{ const r=tr2[k]; if(!r||r.tap) return; r.tap=true; r.rt=Math.round(now()-t0); };
    btn.onclick=press; btn.addEventListener('touchstart',e=>{ e.preventDefault(); press(); },{passive:false});
    keyH=e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); press(); } }; document.addEventListener('keydown',keyH);
    later(step,600*F); };
  intro('focus',()=>{ screen('prac-focus',true); play(focusSeq(FOCUS_PRAC),true,tr2=>{ document.removeEventListener('keydown',keyH); keyH=null;
    const ng=tr2.filter(r=>r.d===3), held=ng.filter(r=>!r.tap).length; const fb=$1('.cg-tally'); fb.textContent=tr('focusFb',{n:ng.length,k:held}); fb.style.color='var(--ink)';
    const af=$1('.cg-after'); af.classList.add('cg-dock'); af.innerHTML=`<button class="cg-btn" data-next>${T.next}</button>`; $1('[data-next]').onclick=()=>ready('focus',0,run); }); });
  function run(){ screen('focus-item',false); play(focusSeq(FOCUS_N),false,tr2=>{ document.removeEventListener('keydown',keyH); keyH=null;
    const part=a=>{ const ng=a.filter(r=>r.d===3), go=a.filter(r=>r.d!==3), rts=go.filter(r=>r.tap&&r.rt!=null).map(r=>r.rt), m=rts.length?rts.reduce((x,y)=>x+y,0)/rts.length:0,
        sd=rts.length>1?Math.sqrt(rts.reduce((x,y)=>x+(y-m)*(y-m),0)/(rts.length-1)):0;
      return {nogo:ng.length,com:ng.filter(r=>r.tap).length,go:go.length,om:go.filter(r=>!r.tap).length,rt:Math.round(m),cv:m?r3(sd/m):0}; };
    const n=tr2.length, th=[part(tr2.slice(0,Math.floor(n/3))),part(tr2.slice(Math.floor(n/3),Math.floor(2*n/3))),part(tr2.slice(Math.floor(2*n/3)))], all=part(tr2);
    S.raw.focus={...all,thirds:th}; done(); }); } }

/* ═══ 점수 ═══ */
function zs(raw){ const z={}, N=NORM;
  z.rule=(raw.rule.theta-N.rule.m)/N.rule.sd;
  z.seq=(raw.seq.theta-N.seq.m)/N.seq.sd;
  z.rot=((raw.rot.right-raw.rot.wrong)-N.rot.m)/N.rot.sd;                                   // 2분 동안 (맞힘−틀림)
  z.wm=(raw.wm.pc-N.wm.m)/N.wm.sd;
  z.speed=(raw.speed.hit-N.speed.m)/N.speed.sd;                                             // 90초 동안 맞힌 개수
  z.learn=(raw.learn.sum-N.learn.m)/N.learn.sd;
  z.keep=raw.keep?(raw.keep.n-N.keep.m)/N.keep.sd:null;
  z.focus=raw.focus?(focusRaw(raw.focus)-N.focus.m)/N.focus.sd:0;
  return z; }
const focusRaw=f=>(f.nogo?1-f.com/f.nogo:1)-(f.go?f.om/f.go:0);
// 집중 저하 → 라이벌 게이지가 내려가는 속도(1 = 보통, 0.6~1.6). 뒤 1/3의 실수율·반응 흔들림이 앞 1/3보다 클수록 빨라짐.
function fatigueOf(f){ if(!f||!f.thirds) return 1; const a=f.thirds[0], b=f.thirds[2], err=x=>(x.nogo?x.com/x.nogo:0)*0.7+(x.go?x.om/x.go:0)*0.3;
  return clamp(r3(1+1.5*(err(b)-err(a))+2*((b.cv||0)-(a.cv||0))),0.6,1.6); }
const toS=z=>clamp(Math.round(100+15*z),LO,HI);
const to24=x=>Math.round(100+(x-100)*K24);
function typeOf(z,raw){ const zR=(z.rule+z.seq)/2, zW=(z.wm+z.speed)/2, zL=z.learn; let zK;
  if(z.keep!=null) zK=z.keep;

    const r=Lr.end==null?RET.m:Math.min(1,Lr.end/Math.max(4,last)); zK=(r-RET.m)/RET.sd; }   // 마지막 바퀴가 4개 미만이면 4로 나눔(작은 수로 부풀지 않게)

  let s2=0,sAll=0; for(const a of SHOW){ s2+=NORM[a].w*NORM[a].w; sAll+=NORM[a].w; }

function build(raw,at,pairs){ const s=score(raw);
  return {v:1,at,idx:s.idx,idx24:s.idx24,areas:s.areas,type:s.type,focus:raw.focus?{fat:fatigueOf(raw.focus),score:s.areas.focus}:null,raw,recall:{pairs:pairs.map(p=>({w:p.w,g:p.g})),dueAt:at+RECALL_AFTER,done:false}}; }
const clone=o=>JSON.parse(JSON.stringify(o));

/* ═══ 결과 화면 ═══ */
function curveSVG(lo,hi){ const X=s=>10+(s-55)/90*300, Y=s=>80-64*Math.exp(-Math.pow((s-100)/15,2)/2);
  const path=(a,b)=>{ let d=`M${X(a).toFixed(1)} 80`; for(let s=a;s<=b+0.01;s+=1) d+=`L${X(s).toFixed(1)} ${Y(s).toFixed(1)}`; return d+`L${X(b).toFixed(1)} 80Z`; };
  return `<svg class="cg-curve" viewBox="0 0 320 98" aria-hidden="true"><path d="${path(55,145)}" style="fill:var(--track)"/><path d="${path(lo,hi)}" style="fill:var(--acc)"/>
   <line x1="10" y1="80" x2="310" y2="80" style="stroke:var(--line)" stroke-width="1.5"/>${[70,85,100,115,130,145].map(v=>`<text x="${X(v)}" y="95" text-anchor="middle" style="fill:var(--sub);font-size:10px;font-weight:600">${v}</text>`).join('')}</svg>`; }
const pctOf=v=>clamp(50+(v-100)/45*50,3,100);   // 100 = 가운데, 145 = 끝

  ${o.primary?`<div class="cg-dock"><button class="cg-btn" data-go>${o.primary}</button></div>`:''}
  <div class="cg-stack" style="margin-top:4px">${o.share?`<button class="cg-ghost" data-share>${T.share}</button>`:''}${o.closeBtn?`<button class="cg-ghost" data-close>${T.close}</button>`:''}</div>
  ${refsHTML()}<p class="cg-notice">${T.notice}</p></section>`; }

/* ═══ 공유 카드 (1080×1350, 앱 밝은 색, 이름 없음) ═══ */
const PAL={bg:'#f4f1ea',card:'#fffdf8',ink:'#1d1b17',sub:'#6b6458',line:'#e5dfd2',track:'#ece6d9',acc:'#2f5d50',accsoft:'#e3ede8',dop:'#7a5cc4',dopsoft:'#efe9fb',amber:'#c98a1b'};
function shareCard(res){ setLang(); const cv=document.createElement('canvas'); cv.width=1080; cv.height=1350; const x=cv.getContext('2d'); const P=PAL;
  const FF='-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Noto Sans",system-ui,sans-serif';
  const font=(w,s)=>{ x.font=`${w} ${s}px ${FF}`; };
  const circ=(cx,cy,r,c)=>{ x.fillStyle=c; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill(); };
  const rr=(X,Y,W,H,R)=>{ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); };

  font(800,62); x.fillStyle=P.dop; const tl=wrap(ty[L]||T['ty_'+(ty.code||'FL')],856).slice(0,2); let y=418; tl.forEach(s=>{ x.fillText(s,112,y); y+=76; });
  y+=110; font(850,88); x.fillStyle=P.ink; x.fillText(tr('lqBig',{l:res.idx.mid}),108,y);

  x.fillStyle=P.line; x.fillRect(112,y+136,856,3); y+=40;

    font(700,30); x.textAlign='right'; x.fillText(T[lvlOf(v)],bx+bw,by); x.textAlign='left';
    rr(bx,by+12,bw,14,7); x.fillStyle=P.track; x.fill(); rr(bx,by+12,Math.max(14,bw*pctOf(v)/100),14,7); x.fillStyle=k==='n_keep'?P.dop:P.acc; x.fill();

/* ═══ 진행 ═══ */
const AREA_FN={rule:aRule,learn:aLearn,seq:aSeq,rot:aRot,wm:aWm,speed:aSpeed,focus:aFocus};
function runArea(i){ if(!S) return; if(i>=FLOW.length) return endRecall(finishTest);
  setStep(i,tr('step',{i:i+1,n:T['n_'+FLOW[i]]})); clockStop(); AREA_FN[FLOW[i]](()=>{ clockStop(); runArea(i+1); }); }
function finishTest(){ const at=Date.now(); S.raw.ms=Math.round(now()-S.t0); S.raw.lang=L; if(FAST) S.raw.fast=F;
  const res=build(S.raw,at,S.pairs); S.res=res; const o=S;
  const q=root.querySelector('.cg-quit'); if(q){ q.classList.add('cg-off'); } const l=root.querySelector('.cg-steplab'); if(l) l.textContent=T.title;
  main(resultHTML(res,{primary:T.pick,share:typeof o.onShare==='function'}));
  $1('[data-go]').onclick=()=>{ const cb=o.onDone, r=clone(res); closeOverlay(); if(cb) cb(r); };
  const st=$1('.cg-res .cg-stack'); if(st){ st.insertAdjacentHTML('beforeend',`<button class="cg-ghost" data-pl>${T.pickLater}</button>`); $1('[data-pl]').onclick=()=>{ const cb=o.onDone, r=clone(res); closeOverlay(); if(cb) cb(r,{later:true}); }; }
  const sb=$1('[data-share]'); if(sb) sb.onclick=()=>doShare(res,o.onShare); }
function startScreen(){ const rows=FLOW.map((a,i)=>`<div class="cg-prow"><div class="cg-num">${i+1}</div><div><b>${T['n_'+a]}</b><span>${T['d_'+a]}</span></div><i>${T['t_'+a]}</i></div>`).join('');
  main(`<section data-screen="start" class="cg-anim">${HERO}<h1 class="cg-title" tabindex="-1" data-focus>${T.title}</h1><p class="cg-tagline">${T.tagline}</p><p class="cg-lead">${T.lead}</p><p class="cg-basis">${T.basis}</p>
    <div class="cg-card cg-plan">${rows}</div>${refsHTML()}
    <ul class="cg-points">${['p1','p2','p3','p4'].map(k=>`<li>${OK_I}<span>${T[k]}</span></li>`).join('')}</ul>
    <div class="cg-dock"><button class="cg-btn" data-next>${T.go}</button><button class="cg-ghost" data-later>${T.later}</button></div></section>`);
  $1('[data-later]').onclick=()=>{ const cb=S&&S.onCancel; closeOverlay(); if(cb) cb(); };
  const qb=root.querySelector('.cg-quit'); if(qb){ qb.textContent=T.close; qb.dataset.a='close0'; }
  $1('[data-next]').onclick=()=>{ if(qb){ qb.textContent=T.quit; qb.dataset.a='quit'; } S.t0=now(); runArea(0); }; }

/* ═══ 공개 API ═══ */
function start(opts){ opts=opts||{}; setLang(); FAST=!!opts.fast; F=FAST?(typeof opts.fast==='number'?opts.fast:0.1):1;

function recallDue(result){ try{ const r=result&&result.recall; return !!(r&&!r.done&&Array.isArray(r.pairs)&&r.pairs.length&&Date.now()-result.at>=RECALL_AFTER&&Date.now()>=(r.dueAt||0)); }catch(e){ return false; } }

    <div class="cg-dock"><button class="cg-btn" data-next>${T.start}</button><button class="cg-ghost" data-a="close">${T.rcLater}</button></div></section>`);
  $1('[data-next]').onclick=()=>{ const order=shuffle(pairs.map((_,i)=>i)); let j=0,c=0; const t0=now();
    const q=()=>{ if(j>=order.length) return fin(); const p=pairs[order[j]]; j++;
      pickScr(p,words,`<div class="cg-qhead"><span>${j} / ${pairs.length}</span></div>`,{name:'recall-item',fb:false},ok=>{ if(ok) c++; q(); }); };
    const fin=()=>{ const r=clone(result); r.raw=r.raw||{}; r.raw.keep={n:c,of:pairs.length,ms:Math.round(now()-t0),at:Date.now()};
      try{ const s=score(r.raw); r.areas=s.areas; r.type=s.type; }catch(e){ r.areas=r.areas||{}; r.areas.keep=toS((c-NORM.keep.m)/NORM.keep.sd); }
      r.recall.done=true;
      main(`<section data-screen="recall-done" class="cg-card cg-ready cg-anim" style="margin-top:18px"><div class="cg-big" style="color:var(--dop)">${c}<span style="font-size:20px;color:var(--sub)"> / ${pairs.length}</span></div>

      $1('[data-next]').onclick=()=>{ const cb=opts.onDone; closeOverlay(); if(cb) cb(r); }; };
    q(); }; }

return {start,showResult,shareCard,recallDue,recall};
})();

<script>
(function(){
// ---- 언어: 기기 언어가 한국어면 ko, 그 밖은 en ----
const LANG=(l=>l.startsWith('ko')?'ko':l.startsWith('ja')?'ja':'en')(((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase());
const LANG_T=LANG==='ja'?'en':LANG; // 일본어는 영어 표를 바탕에 깔고 JA_APP으로 덮어씀
document.documentElement.lang=LANG;
/* 숫자와 단위·이름표가 줄 끝에서 떨어지지 않게(예: '마스터리 73%', '2시간 12분', '100%에') — 화면 글자에만, 글자가 크게 커지면 원래대로 */
(function(){
  const SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,OPTION:1,SELECT:1}, ORIG=new WeakMap(); let on=true;
  const R1=/(\S+) ([+\-−]?[\d₩$¥€][^\s]*)/g, R3=/([%)\]])(?=[가-힣])/g, R4=/(\d)-(?=\d)/g;
  const calc=v=>{ let x=v.replace(R3,'$1⁠').replace(R4,'$1‑'); if(on) x=x.replace(R1,(m,a,b)=>(a.length+b.length<=8&&a!=='·'&&a!=='/')?a+' '+b:m); return x; };
  const fix=n=>{ const v=ORIG.has(n)?ORIG.get(n):n.data; const x=calc(v); if(x!==n.data){ if(!ORIG.has(n)) ORIG.set(n,v); n.data=x; } };
  const walk=(root,f)=>{ if(!root) return; if(root.nodeType===3){ if(!(root.parentElement&&SKIP[root.parentElement.tagName])) f(root); return; } if(root.nodeType!==1||SKIP[root.tagName]) return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&SKIP[n.parentElement.tagName]?2:1}); let n; while((n=w.nextNode())) f(n); };
  const check=()=>{ const want=parseFloat(getComputedStyle(document.documentElement).fontSize)<=20; document.documentElement.classList.toggle('bigtext',!want); if(want!==on){ on=want; walk(document.body,fix); } };
  const go=()=>{ on=parseFloat(getComputedStyle(document.documentElement).fontSize)<=20; document.documentElement.classList.toggle('bigtext',!on); walk(document.body,fix);
    new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>walk(n,fix)))).observe(document.body,{childList:true,subtree:true});
    new MutationObserver(check).observe(document.documentElement,{attributes:true,attributeFilter:['style','class']}); };
  if(document.body) go(); else document.addEventListener('DOMContentLoaded',go);
})();
// 앱 이름은 이 한 곳에서만 — 라이벌로그/Rivalog(대표님 결정 10-15, 법무 상표 검색 중).

// 학습 수준(평균 100 눈금)별 시간 배수 [처음 볼 때, 다시 볼 때] — 100 = 1.
// 근거(note_1015_research): Fox·Taylor·Caylor 1969(낮은 적성은 훈련 시간 2~4배, 비선형) · Ackerman 1988(차이는 처음 배울 때 가장 크고
// 연습할수록 줄어듦) · Bloom 1978. 군 훈련 자료보다 보수적으로 잡은 '가정'이다. 망각(기억 규칙)은 수준과 무관하게 모두 같다(Slamecka & McElree 1983).
const MULT={80:[1.8,1.4],85:[1.55,1.27],90:[1.3,1.15],95:[1.15,1.07],100:[1,1],105:[.94,.975],110:[.89,.95],115:[.85,.925],120:[.81,.9],125:[.78,.885],130:[.75,.87],135:[.73,.86],140:[.71,.85],145:[.69,.84]};   // 135~145 는 같은 기울기로 늘린 가정(검사 결과가 130 넘는 사람용)

  if(w&&w.l>0&&(!r||!(r.at>0)||w.at>r.at)) return clamp(w.l,70,145); return r&&r.idx?clamp(r.idx.mid,70,145):100;};
// 무료 = '나를 닮은 라이벌'(내 수준 · 노력 5%). 플러스가 끝나도 고른 값(S.rv)은 지우지 않고, 다시 켜지면 돌아온다.

    let a; if(d===0) a=Math.max(0,st.perDay-st.todayDone); else { const wl=sumWv(v,day,g); a=Math.ceil(posAfter(p,pos,workOf(p,pos,st.need)*w/Math.max(1e-9,wl))-pos-1e-6); }

// 책·강의 수는 제한하지 않는다(대표님 10-15 "책 권수를 제한할필요는 없을거같은데?").

// ==== 시험 사용자 리뷰 반영(10-15, 대표님 "모두 수정하고 보고해") ====
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
// 'YYYY-MM-DD' 를 그 지역의 날짜로 읽는다(new Date('YYYY-MM-DD')는 UTC 자정이라 미국에서 하루 앞당겨 보였음).
const pd=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1);};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dIdx=(p,t)=>Math.round((dayStart(t)-dayStart(p.start))/DAY);

// ---- 라이벌 진도 ----
// 라이벌은 하루 몫을 그날 끝에 마친다(하루 단위). 오늘 하루의 비교 기준은 '어제까지' 위치, 오늘 끝 위치는 rvAt(오늘+1).
// 라이벌 설정(수준·노력)·목표일·분량이 바뀌면 그날 위치를 고정(p.rvH)하고 그 뒤만 새 속도로 간다 — 지난 기록이 소급해서 바뀌지 않게.
function rvParams(p){ const k=p.kind==='lec'?[1,1]:rvRatios();
  let c=calOn(p)?p.cal:null;   // 플러스 · 실제 기록에 맞춘 라이벌(1.0.1)
  const F=rvEff().friend&&S.rvFriend&&S.rvFriend.s>0&&p.kind!=='lec'?S.rvFriend:null;
  if(F){ const on=wvOf(p).filter(x=>x>0); c={t:minPerOf(p),cs:Math.round(F.s*shareOf(p)),ca:F.a!=null?F.a/100:1,wa:on.length?on.reduce((a,b)=>a+b,0)/on.length:1}; }
  return Object.assign({ver:2,g:p.goal,need:totalOf(p)*p.rounds,T:totalOf(p),k1:+k[0].toFixed(4),k2:+k[1].toFixed(4),v:wvOf(p).join(','),t:+(c?c.t:minPerOf(p)).toFixed(3),f:fOf(p),x:+(extraMin()*shareOf(p)).toFixed(2),rs:rvRest()?1:0,mr:restOn()?1:0},
    c?{cs:c.cs,ca:+Math.min(1,c.ca+CAL_ADH_UP).toFixed(3),wa:c.wa||1}:{}); }
const sigOf=P=>P.ver===2?['2',P.g,P.need,P.T,P.k1,P.k2,P.v,P.t,P.f,P.x,P.rs,P.mr].join('|')+(P.cs>0?'|c'+[P.cs,P.ca,P.wa].join('|'):''):[P.g,P.need,P.T,P.e,P.k1,P.k2,P.w||'0123456'].join('|');
const wOfP=P=>(P.w||'0123456').split('').map(Number);
// 라이벌 하루(ver 2) = 원래 계획의 그날 몫을 앉는 시간으로 바꾼 것 + 30분 → 쉬는 방식(50/10 · 쉬지 않음)대로 실공부 → ÷ 라이벌 표준 시간
//   라이벌 표준 시간 = 내 표준 시간 ÷ 수준 비율(처음 볼 때 k1 · 다시 볼 때 k2). 계획에 없는 날은 쉬고, 계획한 날은 빠지지 않는다.
function rvRun2(p,A,toD){ const P=A.P, v=P.v.split(',').map(Number), s0=dayStart(p.start), all=sumWv(v,s0,pd(P.g).getTime());
  const TW=workSpan(P.T,P.t,P.f,0,P.need,1,1), me=EFF(P.mr), rv=EFF(P.rs);
  let pos=A.pos, k=0; const units=A.units.map(u=>({...u}));
  for(let d=A.d; d<toD && pos<P.need; d++){ const day=s0+d*DAY, w=v[dowOf(day)]; if(!w) continue;
    // 실제 기록에 맞춘 라이벌(P.cs): 공부한 날 비율(P.ca)만큼 고르게 공부하고, 그날 시간 = 내 실제 하루 시간 × 그날 무게 + 더 하는 시간
    if(P.cs>0&&P.ca<1){ const go=Math.floor((k+1)*P.ca)>Math.floor(k*P.ca); k++; if(!go) continue; }
    const seat=(P.cs>0?P.cs*w/(P.wa||1):(all>0?TW*w/all:0)/me)+P.x, np=posAfterW(P.T,P.t,P.f,pos,seat*rv,P.need,P.k1,P.k2);
    crossed(p,pos,np).forEach(c=>{ if(units[c.j]) readUnit(units[c.j], day+20*3600000); }); pos=np; }
  return {pos,units};
}
function rvRun(p,A,toD){ if(A.P&&A.P.ver===2) return rvRun2(p,A,toD);
  const P=A.P, w=wOfP(P), s0=dayStart(p.start), days=Math.max(1,sdCountW(w,s0,pd(P.g).getTime())), base=P.need/days*(1+P.e);
  let pos=A.pos; const units=A.units.map(u=>({...u}));
  for(let d=A.d; d<toD && pos<P.need; d++){ if(!wdOn(w,s0+d*DAY)) continue;   // 라이벌도 계획한 요일에만 공부
    const np=Math.min(P.need,pos+base*(pos<P.T?P.k1:P.k2));
    crossed(p,pos,np).forEach(c=>{ if(units[c.j]) readUnit(units[c.j], s0+d*DAY+20*3600000); }); pos=np; }
  return {pos,units};
}
function rvSync(p){
  if(!p.rvH||!p.rvH.length) p.rvH=[{d:0,pos:0,units:p.units.map(()=>({n:0,S:3,last:0})),P:rvParams(p)}];
  const last=p.rvH[p.rvH.length-1], P=rvParams(p);
  if(sigOf(last.P)!==sigOf(P)){ const d=Math.max(last.d,dIdx(p,Date.now())), s=rvRun(p,last,d);
    p.rvH.push({d,pos:s.pos,units:s.units,P}); store(); }
}
function rvFreeze(p){ rvSync(p); const last=p.rvH[p.rvH.length-1], d=dIdx(p,Date.now());
  if(last.d<d){ const s=rvRun(p,last,d); p.rvH.push({d,pos:s.pos,units:s.units,P:last.P}); } }
function rvAt(p,d){ rvSync(p); let A=p.rvH[0]; for(const h of p.rvH) if(h.d<=d) A=h; return rvRun(p,A,Math.max(A.d,d)); }
function dopplerState(p,at){
  const now=at||Date.now(), d=dIdx(p,now), s=rvAt(p,d), e=rvAt(p,d+1), T=totalOf(p);
  return {pos:Math.round(s.pos), end:Math.ceil(e.pos), m:s.units.reduce((a,u,i)=>a+unitM(u,now)*(p.units[i]?p.units[i].amt:0),0)/T};
}
function stats(p){
  const now=today0().getTime(), total=totalOf(p), need=total*p.rounds;
  const done=Math.min(p.pos,need);
  const goalT=pd(p.goal).getTime(), daysRaw=daysBetween(now,goalT)+1, v=wvOf(p), daysLeft=Math.max(1,sdCount(p,now,goalT)), restToday=daysRaw>0&&!v[dowOf(now)];
  const todayDone=p.log.filter(l=>l.day===now).reduce((a,l)=>a+l.amt,0);
  // 오늘 목표는 오늘 아침 기준으로 고정: 밀린 양+남은 양을, 남은 날들의 공부 가능 시간에 비례해 나눔(대표님 10-19 플래너 개편)
  const startDone=Math.max(0,done-todayDone);
  const wLeft=sumWv(v,now,goalT), wToday=v[dowOf(now)], RW=workOf(p,startDone,need);
  const todayWork=daysRaw<=0?RW:(wLeft>0?RW*wToday/wLeft:0);
  const perSD=Math.max(0,Math.ceil(posAfter(p,startDone,todayWork)-startDone-1e-6));
  // 원래 계획보다 오늘 몫 이상 앞서 있으면 오늘 할 양 0(쉬는 날)
  const planEnd=planPosAt(p,now);
  const perDay=restToday||(startDone>=Math.ceil(planEnd-1e-9)&&daysRaw>0)?0:perSD;
  const todayMin=perDay?workOf(p,startDone,Math.min(need,startDone+perDay)):0;
  return {total,need,done,daysLeft,daysRaw,ended:daysRaw<=0,finished:done>=need,perDay,perSD,restToday,todayDone,startDone,todayMin,round:Math.min(p.rounds,Math.floor(done/total)+1)};
}

// ---- 경주 문구: 실제 차이로 정직하게(리뷰: '오늘 N 하면 따라잡아요'가 틀렸음) ----
function raceInfo(p,st,dop,u,myM){
  const gap=st.done-dop.pos, toLead=Math.max(1,dop.end-st.done+1), left=Math.max(0,st.perDay-st.todayDone), lec=p.kind==='lec';
  const mLine=lec?'':(pct(myM)>pct(dop.m)?t('bothAhead'):pct(myM)<pct(dop.m)?t('butM',{m:pct(dop.m)-pct(myM)}):'');
  if(st.finished) return {state:'ahead',msg:t('finished')};
  const pre=left===0&&st.perDay>0?t('goalDoneBut'):'';
  if(dop.pos>=st.need) return {state:'behind',msg:t('rvFinished',{q:q(nf(st.need-st.done),u)})};
  if(gap>0){ const safe=st.done>dop.end;
    return {state:'ahead',msg:t('ahead',{q:q(nf(gap),u)})+(safe||left===0?mLine:t('keepLead',{q:q(nf(toLead),u)}))}; }
  if(gap===0) return {state:'close',msg:pre+t('even',{q:q(nf(toLead),u)})};
  const g=q(nf(-gap),u);
  if(toLead<=Math.max(2,2*st.perDay)) return {state:left===0?'done':'behind',msg:pre+t('behindToday',{g,q:q(nf(toLead),u)})};
  const d=dIdx(p,Date.now()), span=Math.max(1,Math.min(7,st.daysRaw)), t0=today0().getTime(), sdn=Math.max(1,sdCount(p,t0,t0+(span-1)*DAY)), r7=rvAt(p,d+span).pos, per=Math.ceil((r7-st.done+1)/sdn);
  return {state:left===0?'done':'behind',msg:pre+t(st.daysRaw<7?'behindGoal':'behindWeek',{g,q:q(nf(Math.max(per,1)),u),d:dstr(pd(p.goal))})};
}
const stKey={ahead:'stAhead',close:'stClose',behind:'stBehind',done:'stDone'};

// ---- 오늘 화면(책·강의 공통) — 오늘 할 일을 맨 위로(리뷰: 카드가 쌓여 '다 했어요'가 묻힘) ----
// ---- 오늘 탭 (디자인 검수 10-19: 카드 10장 → '오늘 할 일 · 라이벌 · 다시 볼 단원' 3장 + '기록 더 보기' 접힘) ----
let moreOpen=false;
function nextStudyDay(p){ const v=wvOf(p), t0=today0().getTime(); for(let i=1;i<=7;i++){ const d=t0+i*DAY; if(v[dowOf(d)]>0) return new Intl.DateTimeFormat(LANG,{weekday:'long'}).format(new Date(d)); } return ''; }
function renderToday(p){

  const lec=p.kind==='lec', st=stats(p), u=lec?'강':p.unit, dop=dopplerState(p), myM=lec?0:bookM(p);

    const rng=st.perDay>0?todayRange(p,st,st.todayDone>0&&st.todayDone<st.perDay?st.done:null):'', left=Math.max(0,st.perDay-st.todayDone);

        <div class="num"><div><b>${st.todayDone}</b>${st.perDay?`<br><span>/ ${st.perDay}</span>`:''}</div></div></div>
      <div style="min-width:0"><h2>${title}</h2>${sub?`<div class="muted">${sub}</div>`:''}${subBits?`<div class="muted tdline">${subBits}</div>`:''}</div>
    </div>

    ${rng&&left?`<div class="rngrow"><div style="min-width:0"><div class="label">${t('rangeT')}</div><div class="rng">${rng}</div></div><button class="ghost" id="allDone">${t('allDone')}</button></div>`:''}

  </section>`; }
  const dueCard=due.length?`<section class="card"><h3 class="ct">${t('review')}</h3>
    ${due.slice(0,3).map(x=>`<div class="due"><span class="dot"></span><span class="t">${esc(x.name)}<span class="muted dp">${t('dueMem',{r:pct(x.r)})}</span></span><button class="ghost" data-u="${x.i}">${t('reviewed')}</button></div>`).join('')+(due.length>3?`<button class="lnk" id="toUnits">${t('moreDue',{n:due.length-3})}</button>`:'')}</section>`:'';
  const statsRow=lec?`<div class="stats">

// ==== 실제 기록(공부 시간·속도·공부한 날)과 라이벌 맞추기 (1.0.1 대표님 10-19) ====
// 시간: 타이머(시작/끝) + 직접 넣기 → p.tl=[{day,min,src}]. 양: p.log.
// 일주일쯤 쌓이면 지난 14일로 실제 기록을 정리(무료). 플러스면 계획(또는 지난번 맞춘 값)과 차이가 크게 날 때만 라이벌을 맞춘다
// (대표님: "매주 바뀌면 너무 혼란스럽잖아" → 속도 ±20% · 공부한 날 ±15%p · 하루 시간 ±20% 넘을 때, 그리고 지난번 맞춘 뒤 7일 이상).
// 맞춘 라이벌 = 내 실제 속도 · 내 실제 하루 공부 시간 + 하루 더 하는 시간 · 내 공부한 날 비율 + 10%p(최대 100%).
const CAL_MIN_DAYS=7, CAL_WIN=14, CAL_GAP_T=0.2, CAL_GAP_A=0.15, CAL_GAP_S=0.2, CAL_ADH_UP=0.1;
function tlDay(p,day){ return (p.tl||[]).filter(x=>x.day===day).reduce((a,x)=>a+x.min,0); }
function tlAdd(p,day,min,src){ if(!(min>0)) return null; p.tl=p.tl||[]; const e={day,min:Math.round(min),src}; p.tl.push(e); if(p.tl.length>400) p.tl=p.tl.slice(-400); return e; }
function logEquiv(p){ const T=totalOf(p), f=fOf(p), out={}; let pos=p.pos;
  for(let i=p.log.length-1;i>=0;i--){ const l=p.log[i], a=l.amt||0, b=pos, s=Math.max(0,pos-a); pos=s;
    const eq=p.kind==='lec'?a:workSpan(T,1,f,s,b,1,1), o=out[l.day]||(out[l.day]={amt:0,eq:0}); o.amt+=a; o.eq+=eq; }
  return out; }
// 한 주 단위: 설정 '한 주 시작 요일' 하나(탭 개편 10-24 — 주간 점검·이번 주 점수판·요일별 승부·실제 기록 정리가 같은 주).
// 첫 주는 첫 책을 넣은 다음 날부터. 그날이 시작 요일이 아니면 그 짧은 주가 4일 이상일 때만 한 주로 본다(예전 '월~일'과 같음).
function weekList(){ const a=wkBaseDay(); if(a==null) return null; const now=today0().getTime(), add=(x,n)=>dayStart(x+n*DAY+12*3600000), done=[];
  let x=a; if(wkStartOf(a)!==a&&daysBetween(a,wkEndOf(a))+1<4) x=add(wkEndOf(a),1);
  for(let g=0;g<2000;g++){ const e=wkEndOf(x); if(e<now){ done.push({from:x,to:e}); x=add(e,1); } else return {done,cur:{from:x,to:e}}; }
  return {done,cur:{from:x,to:wkEndOf(x)}}; }
function realStats(p){ if(p.kind==='lec'||!(p.tl&&p.tl.length)) return null;
  const W=weekList(); if(!W) return null; const last=W.done[W.done.length-1], now=today0().getTime();
  if(!last) return {ready:false,next:W.cur.to+DAY};

  let plan=0,studied=0,off=0,tDays=0,tMin=0,sMin=0,sEq=0,wsum=0;
  for(let i=0;i<n;i++){ const d=dayStart(from+i*DAY+12*3600000), w=v[dowOf(d)], m=tlDay(p,d), l=L[d];
    if(w>0){ plan++; wsum+=w; if(l&&l.amt>0) studied++; } else if(l&&l.amt>0) off++;   // 계획에 없던 날 보충
    if(m>0){ tDays++; tMin+=m; } if(m>0&&l&&l.eq>0){ sMin+=m; sEq+=l.eq; } }
  const eff=EFF(restOn()), did=Math.min(plan,studied+off);   // 보충한 날로 빠진 계획일을 채운다(대표님 10-19)
  return {ready:plan>=3&&tDays>=3&&sEq>0,wk:W.done.length,from:last.from,to:last.to,next:W.cur.to+DAY,days:n,plan,studied:did,off,ca:plan?did/plan:1,
    seat:tDays?tMin/tDays:0,tNet:sEq?sMin*eff/sEq:0,tSeat:sEq?sMin/sEq:0,wavg:plan?wsum/plan:1}; }
// 계획이 가정한 값(맞추기 전 기준): 속도 = 표준 시간, 공부한 날 = 100%, 하루 시간 = 계획 몫(앉는 시간)
function calBase(p){ const s0=dayStart(p.start), g=pd(p.goal).getTime(), v=wvOf(p), all=sumWv(v,s0,g), on=v.filter(x=>x>0), wavg=on.length?on.reduce((a,b)=>a+b,0)/on.length:1;
  const TW=workSpan(totalOf(p),minPerOf(p),fOf(p),0,totalOf(p)*p.rounds,1,1);

function calGap(p,r){ const b=p.cal||calBase(p), g=[];
  if(b.t>0&&Math.abs(r.tNet/b.t-1)>=CAL_GAP_T) g.push('t'); if(Math.abs(r.ca-b.ca)>=CAL_GAP_A) g.push('a'); if(b.cs>0&&Math.abs(r.seat/b.cs-1)>=CAL_GAP_S) g.push('s'); return g; }
function calCheck(p){ const r=realStats(p); if(!r||!r.ready) return r?{r,gap:[]}:null; const gap=calGap(p,r);
  const fresh=p.calWk!==r.wk&&!(p.calHold>=r.wk)&&!(p.cal&&Date.now()-p.cal.at<5*DAY);
  if(gap.length&&isPlus()&&fresh){
    rvFreeze(p); const prev=p.cal?{t:p.cal.t,ca:p.cal.ca,cs:p.cal.cs,wa:p.cal.wa,at:p.cal.at}:Object.assign(calBase(p),{base:1});
    p.calLog=(p.calLog||[]).concat([{at:Date.now(),wk:r.wk,t:+r.tNet.toFixed(3),ca:+r.ca.toFixed(3),cs:Math.round(r.seat)}]).slice(-10);
    p.cal={t:+r.tNet.toFixed(3),ca:+r.ca.toFixed(3),cs:Math.round(r.seat),wa:+r.wavg.toFixed(2),at:Date.now(),seen:false,prev}; p.calWk=r.wk; store(); return {r,gap:[],updated:true}; }
  if(isPlus()&&p.calWk!==r.wk&&!gap.length){ p.calWk=r.wk; store(); }

const calOn=p=>p&&p.kind!=='lec'&&p.cal&&isPlus();
const fmtClock=ms=>{ const s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60); return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(s%60).padStart(2,'0'); };
function timeCard(p){ const run=S.timer||null, mine=run&&run.i===S.cur, td=tlDay(p,today0().getTime()), r=p.kind==='lec'?null:realStats(p);

  const note=p.kind==='lec'?'':!r?t('tmNote'):!r.ready?t('tmNoteN',{n:Math.max(1,CAL_MIN_DAYS-r.since),dd:Math.max(1,CAL_MIN_DAYS-r.since)===1?'day':'days'}):'';
  return `<section class="card tcard"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:center"><div style="min-width:0"><div class="label">${t('tmT')}</div>

// ---- 한 주 시작 요일(탭 개편 10-24, 대표님 "고정 말고 선택") — 이 값 하나로 주간 점검·이번 주 점수판·요일별 승부·실제 기록 정리 ----
// S.wkStart = 0~6(일~토). 없으면 예전 '한 주 기준'에서 옮겨 읽음(값 손실 없음): '월~일'(wkMode='mon') → 월요일 · '라이벌 시작일 기준' → 첫 책을 넣은 다음 날의 요일 · 책이 없으면 월요일.
// 주 중간에 바꾸면 다음 주부터: S.wkHist=[{k,at,d}] — k(지금 주 시작)부터 at 전날까지는 지금 주가 이어지고, at(지금 주가 끝난 뒤 처음 오는 새 요일)부터 d 요일로.
function wkBaseDay(){ const books=S.plans.filter(p=>p.kind!=='lec'); if(!books.length) return null; return dayStart(Math.min(...books.map(p=>dayStart(p.start)))+DAY+12*3600000); }
function wkDow0(){ if(S.wkStart>=0&&S.wkStart<=6) return S.wkStart; if(S.wkMode==='mon') return 1; const a=wkBaseDay(); return a==null?1:dowOf(a); }
const wkAlign=(t0,d)=>dayStart(t0-((dowOf(t0)-d+7)%7)*DAY+12*3600000);
function wkStartOf(at){ const t0=dayStart(at), H=S.wkHist||[];
  for(let j=H.length-1;j>=0;j--){ const e=H[j]; if(t0>=e.at) return wkAlign(t0,e.d); if(t0>=e.k) return e.k; }
  return wkAlign(t0,wkDow0()); }
function wkEndOf(at){ const s=wkStartOf(at); let y=s; for(let i=0;i<20;i++){ const n=dayStart(y+DAY+12*3600000); if(wkStartOf(n)!==s) return y; y=n; } return y; }
function wkPending(){ const H=S.wkHist||[], e=H[H.length-1]; return e&&e.at>today0().getTime()?e:null; }

// 바꾸기: 이번 주(고정한 복습 목록 포함)는 그대로, 다음 주부터. 바뀌는 날(at)을 돌려줌 — 바뀔 게 없으면 null

  if(dowOf(k)===d&&at===dayStart(k+7*DAY+12*3600000)){ if(!H.length) delete S.wkHist; store(); return null; }

const wdLong=k=>new Intl.DateTimeFormat(LANG,{weekday:'long'}).format(new Date(2024,0,7+k));
function wkStartCtl(){ const cur=wkShown(); return `<label class="np-wks"><span class="muted">${t('wksL')}</span><select id="wkStart" aria-label="${esc(t('wksL'))}">${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${d===cur?'selected':''}>${wdLong(d)}</option>`).join('')}</select></label>`; }

  if(c&&!c.r.ready){ const nx=c.r.next||(weekList()&&weekList().cur.to+DAY); return `<section class="card rcard"><h3 class="ct">${t('rlT0')}</h3><p class="muted" style="margin:0 0 10px">${nx?t('rlNext',{d:dstr(new Date(nx))}):t('tmNote')}</p>${wkStartCtl()}</section>`; }
  if(!c) return `<section class="card rcard"><h3 class="ct">${t('rlT0')}</h3><p class="muted" style="margin:0 0 10px">${t('tmNote')}</p>${wkStartCtl()}</section>`;

  let msg='';

    <div class="stats" style="margin-top:8px">${stat(t('rlDaysV',{a:r.studied,b:r.plan}),t('rlDays'))}${stat(fmtMin(r.seat),t('rlSeat'))}${stat(t('mOnly',{m:m1(r.tNet)}),t('rlSpeed',{u:uName(u),u1:ONE[u]}),t('rlStdV',{m:m1(std)}))}</div>

    <p class="muted" style="margin:10px 0 8px">${t('rlNext',{d:dstr(new Date(r.next))})}</p>${wkStartCtl()}</section>`; }

  if($('calPlus')) $('calPlus').onclick=()=>openPay('limitCal');

function bindAllToday(){ document.querySelectorAll('[data-alld]').forEach(b=>b.onclick=()=>{ const p=S.plans[+b.dataset.alld], st=stats(p), a=Math.max(0,st.perDay-st.todayDone); if(!a) return;
  if(p.kind==='lec') p.pos=Math.min(st.need,p.pos+a); else advance(p,a); p.log.push({day:today0().getTime(),amt:a}); store(); render(); }); }

// ---- 주간 결산: 그 주가 끝나면 한 번 계산해 고정(p.wkR), 다음 주 첫 3일만 보여 줌 ----
function weekReport(p){
  const t0=today0().getTime(), s0=dayStart(p.start);
  const k=Math.floor((t0-s0)/(7*DAY))-1; if(k<0) return null;
  p.wkR=p.wkR||{}; if(p.wkR[k]) return p.wkR[k];
  const ws=s0+k*7*DAY, we=ws+7*DAY, st=stats(p);
  const inW=p.log.filter(l=>l.day>=ws&&l.day<we), after=p.log.filter(l=>l.day>=we).reduce((a,l)=>a+l.amt,0);
  const sum=inW.reduce((a,l)=>a+l.amt,0), days=new Set(inW.filter(l=>l.amt>0).map(l=>l.day)).size;
  const end=Math.min(st.need,Math.max(0,p.pos-after)), start=Math.max(0,end-sum);
  const planW=Math.round(planPosAt(p,we-DAY)-planPosAt(p,ws-DAY));
  const gap0=Math.round(start-rvAt(p,k*7).pos), gap1=Math.round(end-rvAt(p,k*7+7).pos);
  const r={k,ws,we,sum,days,pct:sum/st.need,plan:planW?sum/planW:1,gap0,gap1};
  p.wkR[k]=r; store(); return r;
}
function weekCard(p){
  const w=weekReport(p); if(!w) return '';
  if(today0().getTime()-w.we>=3*DAY) return '';
  const seen=(S.wk||{})[p.start]; if(seen!=null&&seen>=w.k) return '';
  const u=p.kind==='lec'?'강':p.unit, pc=x=>(Math.round(x*1000)/10).toLocaleString(LANG);
  const g=x=>x===0?t('wkEven'):x>0?t('wkAhead',{q:q(nf(x),u)}):t('wkBehind',{q:q(nf(-x),u)});
  const range=dstr(new Date(w.ws))+' – '+dstr(new Date(w.we-DAY));
  return `<section class="card week1">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="label">${t('wkT',{r:range})} · ${esc(p.book)}</div><button class="ghost sm" id="wkClose" style="flex:none">${t('close')}</button></div>
    <div class="wkgrid">
      <div><b>${w.days}/7</b><span>${t('wkDays')}</span></div>
      <div><b>${q(nf(w.sum),u)}</b><span>${t('wkDone',{p:pc(w.pct)})}</span></div>
      <div><b>${Math.round(w.plan*100)}%</b><span>${t('wkPlan')}</span></div>
    </div>
    <p style="margin:12px 0 0;font-weight:650">${t('wkRival')} ${g(w.gap0)} → <span style="color:${w.gap1>=0?'var(--acc)':'var(--dop)'}">${g(w.gap1)}</span></p>
    <p class="muted" style="margin:6px 0 0">${t(w.gap1>w.gap0?'wkUp':w.gap1<w.gap0?(w.plan>=1?'wkDownOk':'wkDown'):'wkSame')}</p>
  </section>`;
}
function bindWeek(p){ if($('wkClose')) $('wkClose').onclick=()=>{ const w=weekReport(p); S.wk=S.wk||{}; S.wk[p.start]=w?w.k:0; store(); render(); }; }

// ---- 지난번 외운 짝 다시 묻기 — '나중에' 누르면 그날은 숨김 ----
function recallCard(){ const r=lastTest(); let due=false; try{ due=!!(r&&typeof Cog!=='undefined'&&Cog.recallDue(r)); }catch(e){}
  if(!due||S.rcSnooze===today0().getTime()) return '';
  return `<section class="card recall"><div><b>${t('recallT')}</b><div class="muted">${t('recallD')}</div></div><div class="row" style="flex-wrap:nowrap;flex:none"><button class="ghost sm" id="recallLater">${t('later')}</button><button id="recallB">${t('recallBtn')}</button></div></section>`; }

// ---- 오늘 범위(단위에 맞게: 쪽은 '번째 쪽') ----
function todayRange(p,st,from){
  const a=from==null?st.startDone:from, b=Math.min(st.need,st.startDone+st.perDay)-1; if(st.perDay<=0||b<a) return '';
  if(p.kind==='lec') return a===b?t('rLec1',{a:a+1}):t('rLec',{a:a+1,b:b+1});
  const A=itemAt(p,a), B=itemAt(p,b), pre=p.rounds>1?t('rRound',{r:A.r+1}):'', P=rangeKind(p);
  if(P==='G'){ A.n=(p.units[A.k].p0||1)+A.n-1; B.n=(p.units[B.k].p0||1)+B.n-1; }
  return pre+(A.k===B.k&&A.r===B.r?t('rSame'+P,{name:esc(A.name),a:A.n,b:B.n}):t('rSpan'+P,{an:esc(A.name),a:A.n,bn:esc(B.name),b:B.n}));
}

// ==== 1.1 (대표님 10-24) — 1회독 계획 흐름 · 확정 전 미리보기 · 내 계획 · 시험 날 성적표 · AI 모의 응시 · 화면 테마 ====
// 화면 모양(색·글자 크기·간격·모서리)은 여기 쓰지 않는다. 공통 부품(rv-vs·rv-week·rv-duel·rv-gantt·rv-pie·rv-theme)은
// 디자인실장 클래스 목록(라이벌로그_공통부품_클래스.md) 그대로의 HTML 구조·클래스·data-* 값만 만들고, 숫자로 정해지는 길이만 --rv-p 같은 인라인 변수로 넘긴다.
// 새 화면 배치 규칙은 assets/web/design/screens_11.css(토큰 변수 이름만).

// ---- 화면 테마(G): 설정 rl.theme = auto|light|dark(없으면 auto). <html data-theme> 는 늘 앱이 정한다 ----
// 앱(lib/main.dart)이 부트 값 rl.dt(light|dark — 자동이면 휴대폰 밝기)를 넣고, 휴대폰 설정이 바뀌면 RL.theme(…)를 부른다.
const THEME_K='rl.theme';
function themePref(){ try{ const v=DoppelStore.get(THEME_K); return v==='light'||v==='dark'?v:'auto'; }catch(e){ return 'auto'; } }
function sysDark(){ try{ return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches); }catch(e){ return false; } }
function setThemeAttr(eff){ document.documentElement.setAttribute('data-theme',eff==='dark'?'dark':'light'); }
function themeInit(){ let eff=null; try{ eff=DoppelStore.get('rl.dt'); }catch(e){} const p=themePref();
  setThemeAttr(p!=='auto'?p:(eff==='dark'||eff==='light'?eff:(sysDark()?'dark':'light'))); }
themeInit();
window.RL.theme=function(eff){ if(themePref()==='auto') setThemeAttr(eff); };   // 앱: 휴대폰 밝기가 바뀌면(자동일 때만)
function themeCard(){ const v=themePref(), o=(k,l)=>`<button type="button" class="rv-theme__opt ${v===k?'on':''}" role="radio" aria-checked="${v===k}" data-v="${k}">${t(l)}</button>`;
  return `<section class="card"><div class="label">${t('thT')}</div><div class="rv-theme seg seg3" role="radiogroup" aria-label="${esc(t('thT'))}">${o('auto','thAuto')}${o('light','thLight')}${o('dark','thDark')}</div></section>`; }
function bindTheme(){ document.querySelectorAll('.rv-theme__opt').forEach(b=>b.onclick=()=>{ const v=b.dataset.v; try{ DoppelStore.set(THEME_K,v); }catch(e){}
  if(v!=='auto') setThemeAttr(v); else setThemeAttr(sysDark()?'dark':'light');   // 앱이 곧 휴대폰 밝기로 다시 넣는다
  nat({t:'theme',v}); render(); }); }

// ---- 루틴(A-1): S.week 를 '이름 있는 루틴 + 그날 공부 시간(분)'으로 쓴다(v:2). 계산은 예전 그대로 S.week 의 블록으로 한다 ----
// S.week = {v:2, rest, r:[{n:이름, m:분, b:[[시작,끝]], d:[요일]}]} — m 분짜리 블록 하나(시각은 9시부터, 의미 없음).
// 예전 사용자(시간 블록 루틴)는 읽을 때 요일별 시간이 같은 날끼리 루틴 하나로 묶어 보여 주고, 저장할 때만 바꾼다.
// 바꾸기 전 원본은 S.weekOld 에 그대로 남긴다(지우지 않음). rest(50분 공부·10분 휴식)는 예전 값을 그대로 둔다 — 하루 계산이 같게.
const RT_MAX=960;
function rtDefault(){ return {r:[{name:t('rtD1'),m:120},{name:t('rtD2'),m:240}],d:[-1,0,0,0,0,0,1]}; }
function rtFromWeek(W){ const d=[-1,-1,-1,-1,-1,-1,-1];
  if(W&&W.v===2&&Array.isArray(W.r)&&W.r.length){ const r=W.r.map(x=>({name:String(x.n||''),m:Math.max(0,Math.round(+x.m||0))}));
    W.r.forEach((x,i)=>(x.d||[]).forEach(k=>{ if(k>=0&&k<7) d[k]=i; })); return {r,d}; }
  if(W&&Array.isArray(W.r)&&weekSeatW(W)>0){ const r=[], at={};
    [1,2,3,4,5,6,0].forEach(k=>{ const m=Math.round(seatOfW(W,k)); if(!(m>0)) return; if(at[m]==null){ at[m]=r.length; r.push({name:t('rtN',{n:r.length+1}),m}); } d[k]=at[m]; });
    return {r,d}; }
  return rtDefault(); }
function weekFromRt(rt,rest){ return {v:2,rest:rest===1?1:0,r:rt.r.map((x,i)=>{ const m=clamp(Math.round((+x.m||0)/10)*10,0,RT_MAX), s=Math.max(0,Math.min(540,1440-m));
  return {n:String(x.name||'').trim().slice(0,20)||t('rtN',{n:i+1}),m,b:m>0?[[s,s+m]]:[],d:WEEK_DAYS.filter(k=>rt.d[k]===i)}; })}; }
const restOf=W=>W&&W.rest===0?0:W&&Array.isArray(W.r)&&W.r.length?1:0;   // 새 사용자 0(넣은 시간이 곧 공부 시간) · 예전 사용자 값 유지
function saveWeekRt(rt,rest){ if(S.week&&S.week.v!==2&&Array.isArray(S.week.r)&&!S.weekOld) S.weekOld=JSON.parse(JSON.stringify(S.week)); S.week=weekFromRt(rt,rest); delete S.weekSkip; }

// ---- 계획 계산(미리보기·내 계획 공통) — 그날 공부 가능 시간을 남은 공부 시간 비율로 과목마다 나눈다 ----
// 같은 함수를 미리보기(확정 전 값)와 내 계획 화면(저장된 값)이 같이 쓴다 → 미리보기 숫자 = 실제 배분(p.wk · 끝나는 날).
const SIM_DAYS=730;
function simItemOf(p){ const lec=p.kind==='lec', T=totalOf(p), need=T*p.rounds;
  return {name:p.book,unit:lec?'강':p.unit,lec,T,need,pos:Math.min(p.pos,need),t:minPerOf(p),f:fOf(p),goal:p.nogoal?null:pd(p.goal).getTime(),wd:wdOf(p)}; }
// cut: {날짜:분} — 주간 점검으로 정한 복습 시간(그 주 공부 가능 시간에서 먼저 뗌)
function planSim(items,W,from,cut){ const t0=from!=null?from:today0().getTime(), E=EFF(restOf(W)===1);
  const st=items.map(x=>({pos:x.pos,end:x.pos>=x.need-1e-9?t0:null,days:0,min:0,wk:0}));
  const left=k=>workSpan(items[k].T,items[k].t,items[k].f,st[k].pos,items[k].need,1,1);
  const work0=items.map((x,k)=>left(k)), amt0=items.map(x=>Math.max(0,x.need-x.pos));
  for(let d=0; d<SIM_DAYS && st.some(s=>s.end==null); d++){ const day=t0+d*DAY, dow=dowOf(day); let av=seatOfW(W,dow)*E-(cut&&cut[ymd(new Date(day))]||0); if(!(av>0)) continue;
    const got=items.map(()=>false);
    for(let pass=0; pass<4 && av>1e-6; pass++){ const L=items.map((x,k)=>st[k].end==null&&x.wd.includes(dow)?left(k):0), tot=L.reduce((a,b)=>a+b,0); if(tot<=1e-9) break;
      let used=0; items.forEach((x,k)=>{ if(!(L[k]>0)) return; const s=st[k], u=Math.min(av*L[k]/tot,L[k]);
        s.pos=posAfterW(x.T,x.t,x.f,s.pos,u,x.need,1,1); s.min+=u; if(d<7) s.wk+=u; got[k]=true; used+=u;
        if(L[k]-u<=1e-6||s.pos>=x.need-1e-6){ s.pos=x.need; s.end=day; } });
      av-=used; }
    got.forEach((g,k)=>{ if(g) st[k].days++; }); }
  return st.map((s,k)=>({end:s.end,days:s.days,min:s.min,work:work0[k],amt:amt0[k],seatWk:s.wk/E})); }
// 목표일까지 공부하는 날(그 과목이 공부하는 요일 · 공부 가능 시간이 있는 날) 수
function sdUntil(x,W,goal,from){ const t0=from!=null?from:today0().getTime(); let n=0; for(let d=t0; d<=goal; d+=DAY){ const w=dowOf(d); if(seatOfW(W,w)>0&&x.wd.includes(w)) n++; } return n; }
// 무리 신호: 목표일이 있는 과목들이 목표일에 맞추려면 요일마다 얼마가 필요한지(공부 가능 시간 비례) — 가장 넘치는 요일
function overDay(items,W,from){ const t0=from!=null?from:today0().getTime(), E=EFF(restOf(W)===1), need=[0,0,0,0,0,0,0];
  items.forEach(x=>{ if(!x.goal||x.pos>=x.need) return; const v=WEEK_DAYS.map(k=>x.wd.includes(k)?seatOfW(W,k):0), all=sumWv(v,t0,x.goal); if(!(all>0)) return;
    const w=workSpan(x.T,x.t,x.f,x.pos,x.need,1,1); WEEK_DAYS.forEach(k=>{ need[k]+=w*v[k]/all; }); });
  let best=null; WEEK_DAYS.forEach(k=>{ const a=seatOfW(W,k)*E; if(a>0&&need[k]>a+5&&(!best||need[k]-a>best.o)) best={k,a,o:need[k]-a}; }); return best; }
function applySimWk(){ const L=S.plans.map((p,i)=>({p,i})).filter(x=>!stats(x.p).finished); if(!L.length||!hasWeek()) return;
  const res=planSim(L.map(x=>simItemOf(x.p)),S.week,null,curCut()); L.forEach((x,k)=>{ x.p.wk=Math.max(10,Math.round(res[k].seatWk/10)*10); }); }

// ---- 계획 세우기 흐름(최종 1~4 → 미리보기 → 내 계획) ----
// np.mode: first(루틴부터) · add(책 하나 더 — 공부할 것부터) · pass2(2회독 — 목표일부터) · week(설정에서 루틴만)
let np=null;
const NP_STEPS={first:['rt','days','subj','goal','prev'],add:['subj','goal','prev'],pass2:['goal','prev'],week:['rt','days']};
const NP_NUM={rt:[1,'np1'],days:[2,'np2'],subj:[3,'np3'],goal:[4,'np4']};
function npItem(o){ return Object.assign({name:'',unit:'문제',mode:'total',total:'',rows:[{name:t('defRow',{i:1}),amt:''},{name:t('defRow',{i:2}),amt:''}],per:String(MIN_DEF['문제']),goal:ymd(new Date(today0().getTime()+60*DAY)),nogoal:false},o||{}); }
function npStart(mode,o){ const W=S.week;
  np=Object.assign({mode,step:NP_STEPS[mode][0],rt:rtFromWeek(W),rest:restOf(W),rtDirty:!(W&&W.v===2),items:mode==='add'||mode==='first'?[npItem()]:[],exam:S.exam||'',back:null},o||{});
  if(mode==='first'&&hasWeek()) np.step='subj';
  setupOpen=false; planStep=null; scr=null; tab='books'; render(); window.scrollTo(0,0); }
function npWeek(){ return np&&np.rtDirty?weekFromRt(np.rt,np.rest):S.week; }
function npGo(step){ np.step=step; render(); window.scrollTo(0,0); }
function npNext(){ if(np.back==='prev'&&np.step!=='days'&&np.step!=='rt'){ np.back=null; return npGo('prev'); }
  if(np.back==='prev'&&np.step==='days'){ np.back=null; return npGo('prev'); }
  const L=NP_STEPS[np.mode], i=L.indexOf(np.step); npGo(L[Math.min(L.length-1,i+1)]); }
function npPrev(){ if(np.back==='prev'){ np.back=null; return npGo('prev'); }
  const L=NP_STEPS[np.mode], i=L.indexOf(np.step); if(i<=0){ np=null; render(); window.scrollTo(0,0); return; } npGo(L[i-1]); }

function npSimItems(){ const out=[], ref=np.items.map(x=>x.ref).filter(x=>x!=null);

  np.items.forEach((x,k)=>{ const goal=x.nogoal||!x.goal?null:pd(x.goal).getTime();
    if(x.ref!=null){ const p=S.plans[x.ref], T=totalOf(p), r=x.rounds||p.rounds, f=x.fast!=null?x.fast:fOf(p);
      out.push({name:p.book,unit:p.kind==='lec'?'강':p.unit,lec:p.kind==='lec',T,need:T*r,pos:Math.min(p.pos,T*r),t:minPerOf(p),f,goal,wd:wdOf(p),draft:k}); return; }
    const N=npAmt(x), per=parseFloat(x.per)||1;
    out.push({name:x.name.trim()||t(x.unit==='강'?'kindLec':'myBook'),unit:x.unit,lec:x.unit==='강',T:N,need:N,pos:0,t:per,f:FAST_DEF,goal,wd:WD_ALL,draft:k}); });
  return out; }

// ---- 내 1회독 계획(최종 5): 과목별 원 그래프 → 진행 막대(간트) → 시험 날 성적표 줄 → 오늘 공부 시작하기 ----

// 내 1회독 계획(원·간트 + 성적표 줄·주간 점검 다시 보기) — 계획 탭과 확정 뒤 화면이 같이 쓴다
function planParts(){
  const L=S.plans.map((p,i)=>({p,i})).filter(x=>!stats(x.p).finished);
  if(!L.length) return null;
  const items=L.map(x=>simItemOf(x.p)), res=hasWeek()?planSim(items,S.week,null,curCut()):items.map(()=>({end:null}));

// 한 단원 안에서 보다 만 곳은 마지막으로 본 날에 한 번 본 것(안정도 3일)으로 친다.

function repPlanIdx(){ const ok=i=>S.plans[i]&&S.plans[i].kind!=='lec'; if(repPi!=null&&ok(repPi)) return repPi; if(ok(S.cur)) return S.cur; const i=S.plans.findIndex(p=>p.kind!=='lec'); return i<0?null:i; }

function logDays(p){ return new Set(p.log.filter(l=>l.amt>0).map(l=>l.day)).size; }

// ---- 오늘 점수판(rv-vs) · 이번 주 라이벌(rv-vs--week + rv-week) — B의 부품 구조, 제목·안내는 A 문구 ----

function dayFrac(){ const now=Date.now(), t0=today0().getTime(), cur=(now-t0)/60000, W=S.week;

  return `<section class="rv-vs" data-state="${state}" data-unit="${esc(uName(u))}">

  </section>`; }
// 이번 주: 설정의 한 주 기준(라이벌이 생긴 다음 날부터 7일 · 또는 월~일)
function weekRange(){ const t0=today0().getTime(); return {from:wkStartOf(t0),to:wkEndOf(t0)}; }
function weekInfo(p){ const R=weekRange(), t0=today0().getTime(), days=[]; let me=0,rv=0,w=0,l=0,ti=0;
  const nD=Math.min(14,Math.round((R.to-R.from)/DAY)+1);   // 시작 요일을 바꾼 주는 7일보다 길 수 있음
  for(let k=0;k<nD;k++){ const day=dayStart(R.from+k*DAY+12*3600000), d=dIdx(p,day), mine=p.log.filter(x=>x.day===day).reduce((a,x)=>a+x.amt,0);

    if(day<t0){ const r=Math.round(rvDay(p,d)); me+=mine; rv+=r; const res=!mine&&!r?'none':mine>r?'win':mine<r?'lose':'tie'; if(res==='win') w++; else if(res==='lose') l++; else if(res==='tie') ti++; days.push({day,res}); }
    else if(day===t0){ const r=Math.round(rvDay(p,d)*dayFrac()); me+=mine; rv+=r; days.push({day,res:'today'}); }
    else days.push({day,res:'none'}); }
  return {R,days,me,rv,w,l,ti}; }
function weekRowHTML(p){ const I=weekInfo(p); return `<button type="button" class="lrow" id="rwOpen"><span class="lt"><span class="muted">${t('rwT')}</span><b>${I.ti?t('rwSumT',{w:I.w,l:I.l,t:I.ti}):t('rwSum',{w:I.w,l:I.l})}</b></span><span class="chev" aria-hidden="true">›</span></button>`; }
function rivalWeekHTML(p){

const wkKey=at=>ymd(new Date(wkStartOf(at!=null?at:Date.now())));   // 그 주 시작 날(설정 '한 주 시작 요일')
const nextCheckDay=()=>dayStart(wkEndOf(Date.now())+DAY+12*3600000);
function wqHas(pi,i){ return (S.wq||[]).some(x=>x.pi===pi&&x.i===i); }

// 지난주 n일 공부 · 계획의 n%
function wcLead(){ const k=pd(wkKey()).getTime(), a=wkStartOf(k-DAY), b=dayStart(k-DAY+12*3600000), days=new Set(); let did=0, plan=0;
  S.plans.forEach(p=>{ p.log.forEach(l=>{ if(l.day>=a&&l.day<=b&&l.amt>0){ days.add(l.day); did+=l.amt; } });
    if(dayStart(p.start)<=b){ try{ plan+=Math.max(0,planPosAt(p,b+DAY)-planPosAt(p,Math.max(a,dayStart(p.start)))); }catch(e){} } });
  return days.size?t('wcLead',{d:days.size,p:plan>0?Math.round(did/plan*100):100}):t('wcNoLog'); }
// 후보: ① 담아 둔 것 ② 시험 날 아바타 기억이 낮은 단원 ③ 지금 기억이 낮은 단원 — 겹치면 하나, 최대 3개
function wcCands(){ const out=[], has=(pi,i)=>out.some(x=>x.pi===pi&&x.i===i), ok=(pi,i)=>{ const p=S.plans[pi]; return p&&p.kind!=='lec'&&p.units[i]&&!stats(p).finished; };
  (S.wq||[]).forEach(x=>{ if(out.length<WC_MAX&&ok(x.pi,x.i)&&!has(x.pi,x.i)) out.push({pi:x.pi,i:x.i,src:x.src,why:x.src==='ai'?t('wcWhyAi'):t('wcWhyRep',{r:pct(x.r||0)})}); });
  if(S.exam) S.plans.forEach((p,pi)=>{ if(p.kind==='lec'||stats(p).finished) return; const ex=examCalc(p); if(!ex||!ex.ready) return;
    ex.weak.forEach(w=>{ if(out.length<WC_MAX&&w.m<0.8&&!has(pi,w.i)) out.push({pi,i:w.i,src:'report',why:t('wcWhyRep',{r:pct(w.m)})}); }); });
  const mem=[]; S.plans.forEach((p,pi)=>{ if(p.kind==='lec'||stats(p).finished) return; p.units.forEach((u,i)=>{ if(u.n>0){ const r=R(u); if(r<0.8) mem.push({pi,i,r}); } }); });
  mem.sort((a,b)=>a.r-b.r).forEach(x=>{ if(out.length<WC_MAX&&!has(x.pi,x.i)) out.push({pi:x.pi,i:x.i,src:'memory',why:t('wcWhyMem',{r:pct(x.r)})}); });
  return out.map(x=>Object.assign(x,{name:S.plans[x.pi].units[x.i].name,on:true})); }
// 그 주 남은 공부일(오늘 포함) — 루틴 시간이 있는 날
function wcDays(key){ const k=pd(key).getTime(), t0=today0().getTime(), all=[], left=[];
  const e=wkEndOf(k); for(let j=0;j<14;j++){ const d=dayStart(k+j*DAY+12*3600000); if(d>e) break; if(seatOfW(S.week,dowOf(d))>0){ all.push(d); if(d>=t0) left.push(d); } } return {all,left}; }
// 복습 시간 = 단원 분량 × 1개당 시간 × 다시 볼 때 비율(fOf, 기본 0.87). 주 중간 첫 실행이면 남은 날 비율만큼 줄인다
function wcMin(x,frac){ const p=S.plans[x.pi], u=p.units[x.i]; return Math.max(5,Math.round(u.amt*minPerOf(p)*fOf(p)*frac/5)*5); }
function wcBuild(items,key){ const D=wcDays(key), frac=D.all.length?D.left.length/D.all.length:0, cut={}, days={};
  const seat=D.left.map(d=>seatOfW(S.week,dowOf(d))*EFF(restOn())), tot=seat.reduce((a,b)=>a+b,0);
  items.filter(x=>x.on).forEach(x=>{ const m=wcMin(x,frac); D.left.forEach((d,j)=>{ const v=tot>0?Math.round(m*seat[j]/tot):0; if(!(v>0)) return; const k=ymd(new Date(d));
    cut[k]=Math.min((cut[k]||0)+v,seat[j]); (days[k]=days[k]||[]).push({pi:x.pi,i:x.i,min:v}); }); });
  return {cut,days,min:Object.values(cut).reduce((a,b)=>a+b,0)}; }
// 진도 끝나는 날(가장 늦은 과목) — 내 계획 화면과 같은 계산

// ---- 친구와 라이벌 바꾸기 (1.0.1 대표님 10-19) — 서버 없이 '라이벌 코드' 글자로 주고받는다 ----
// 코드에 담는 것: 학습 수준 · 하루 더 하는 시간 · 쉬는 방식 · 라이벌 이름. 검사 점수의 세부·공부 기록은 담지 않는다.
// 보내기는 이용자가 공유 창에서 직접 고른다(앱이 기기 밖으로 보내지 않음). 받은 코드는 이 기기 안에서만 읽는다.
const RC_PRE='RIVALOG-', EFF_OF_MIN={15:0.03,30:0.05,60:0.1};
function b64u(s){ const b=new TextEncoder().encode(s); let x=''; b.forEach(c=>x+=String.fromCharCode(c)); return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); }
function rcSum(s){ let h=7; for(const c of s) h=(Math.imul(h,31)+c.charCodeAt(0))>>>0; return (h%1679616).toString(36).toUpperCase().padStart(4,'0'); }
// 내 실제 기록(최근 28일, 모든 책·강의): 기록한 날 수 d · 공부한 날 하루 평균 s분 · 계획한 날 중 공부한 비율 a%
function shareStats(){ const now=today0().getTime(), per={};
  S.plans.forEach(p=>(p.tl||[]).forEach(x=>{ if(x.day>=now-28*DAY&&x.day<now) per[x.day]=(per[x.day]||0)+x.min; }));
  const ds=Object.keys(per), d=ds.length, s=d?Math.round(ds.reduce((a,k)=>a+per[k],0)/d):0; let st=0,pl=0;
  S.plans.forEach(p=>{ const r=realStats(p); if(r&&r.plan){ st+=r.studied; pl+=r.plan; } });
  return {d,s,a:pl?Math.round(st/pl*100):null}; }
const syncLv=d=>d<=0?0:d<7?1:d<14?2:d<28?3:4;
function syncHTML(d,mine){ const lv=syncLv(d); return `<div class="sync"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${t('syT')} · ${t('sy'+lv)}</b><span class="muted">${d>0?t('syDays',{d}):t('syNone')}</span></div>
  <div class="sybar">${[1,2,3,4].map(i=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</div><span class="muted" style="font-size:0.75rem">${t(mine?(lv>=3?'syMineHi':'syMineLo'):'syFr'+(lv>=2?'Hi':'Lo'))}</span></div>`; }
function myRivalSpec(){ const c=rvEff(), pl=c.friend?(S.rvFriend&&S.rvFriend.p?1:0):(!c.same&&!(S.rv&&S.rv.free)?1:0);
  const z=c.friend&&S.rvFriend?{d:S.rvFriend.d||0,s:S.rvFriend.s||0,a:S.rvFriend.a}:shareStats();   // 받은 라이벌을 다시 보내면 원래 기록을 그대로
  return {l:Math.round(c.same?myLevel():c.level),e:EXTRA_OF(c.effort),r:rvRest()?1:0,n:[...String(S.rival||t('rvDefault'))].slice(0,12).join(''),p:pl,d:z.d,s:z.d>=7?z.s:0,a:z.d>=7&&z.a!=null?z.a:null}; }
function rivalCode(){ const s=myRivalSpec(), body=b64u(JSON.stringify(Object.assign({v:1,l:s.l,e:s.e,r:s.r,n:s.n,p:s.p,d:s.d},s.s>0?{s:s.s}:{},s.a!=null?{a:s.a}:{}))); return RC_PRE+body+'-'+rcSum(body); }
function parseRivalCode(txt){ const m=String(txt||'').match(/RIVALOG-([A-Za-z0-9_-]+)-([0-9A-Z]{4})/); if(!m||rcSum(m[1])!==m[2]) return null;
  try{ const o=JSON.parse(unb64u(m[1])), l=Math.round(+o.l), e=+o.e; if(o.v!==1||!(l>=70&&l<=145)||!EFF_OF_MIN[e]) return null;   // LQ 하한 70(보내는 쪽 myLevel과 같게 · 감사 10-19)
    const d=Math.max(0,Math.min(999,Math.round(+o.d||0))), sm=Math.round(+o.s||0), am=o.a==null?null:Math.round(+o.a);
    return {l,e,r:o.r===0?0:1,p:o.p===1?1:0,d,s:d>=7&&sm>0&&sm<=1440?sm:0,a:d>=7&&am!=null&&am>=0&&am<=100?am:null,n:[...String(o.n||'').replace(/[\u0000-\u001f<>]/g,'')].slice(0,12).join('')||t('rvDefault')}; }catch(_){ return null; } }
function applyFriend(fr){ S.plans.forEach(rvFreeze); S.rvNoRest=!fr.r; S.rv={level:fr.l,effort:EFF_OF_MIN[fr.e],src:'friend'}; S.rvFriend=fr; S.rvPicked=true; if(fr.n) S.rival=fr.n; store(); }
const rcRest=r=>t(r?'rr1':'rr0');
function swapCard(){ return `<div class="swap"><div class="label">${t('rcT')}</div><p class="muted" style="margin:4px 0 8px">${t('rcP')}</p>
  <div class="row" style="gap:6px"><button type="button" class="ghost sm" id="rcSend">${t('rcSend')}</button><button type="button" class="ghost sm" id="rcIn">${t('rcIn')}</button></div><div id="rcBox"></div></div>`; }
function bindSwap(){ const box=$('rcBox'); if(!box) return;
  $('rcSend').onclick=()=>{ if(rvEff().same&&!lastTest()){ box.innerHTML=`<p class="muted" style="margin:10px 0 6px">${t('rcNeedTest')}</p><button type="button" id="rcTest">${t('rcTestB')}</button>`; $('rcTest').onclick=startFind; return; }
    const s=myRivalSpec(), c=rivalCode();
    box.innerHTML=`<div class="rcbox">${syncHTML(s.d,true)}<p style="margin:0;font-weight:650;font-size:0.875rem">${t('rcWhat',{l:LQV(s.l),e:s.e,r:rcRest(s.r),n:esc(s.n)})}${s.s>0?' · '+t('rcWhatReal',{s:fmtMin(s.s),a:s.a!=null?s.a:'–'}):''}</p><p class="muted" style="margin:0">${t('rcPriv')}</p>

    $('rcCopyB').onclick=copy; };

      pv.innerHTML=`${syncHTML(fr.d,false)}<div class="ropt on" style="cursor:default;margin-top:8px"><span class="rl"><b>${t('rcPrev',{n:esc(fr.n),l:LQV(fr.l),e:fr.e,r:rcRest(fr.r)})}${fr.s>0?' · '+t('rcWhatReal',{s:fmtMin(fr.s),a:fr.a!=null?fr.a:'–'}):''}</b></span><span class="muted">${t('rcNote2')}</span>${fr.p&&!isPlus()?`<span class="muted" style="color:var(--dopink);font-weight:600">${t('rcPlusLine')}</span>`:''}</div><button type="button" id="rcUse" style="width:100%;margin-top:8px">${t('lqFriend')}</button><button type="button" class="ghost" id="rcMine" style="width:100%;margin-top:6px">${t('lqMine')}</button><p class="muted" style="margin:4px 0 0">${t('lqD')}</p>`;
      $('rcUse').onclick=()=>{ applyFriend(fr); toast(t('rcUsed')); render(); };
      $('rcMine').onclick=()=>{ S.webLQ={l:fr.l,at:Date.now()}; store(); toast(t('lqMineOk',{l:LQV(fr.l)})); render(); }; }; };
}

    // 쪽 ↔ 문제·슬라이드: 분량 칸 모양이 달라서 이름은 두고, 분량은 같은 모양끼리만 옮긴다
    const sameShape=(old==='쪽')===(u==='쪽');
    names.forEach((n,i)=>{ const v=keep.find(x=>x.name===n); addRow(n, sameShape&&v?v.amt:'', sameShape&&v?v.p0:0); });
    if(!names.length) for(let i=1;i<=3;i++) addRow(t(u==='장'?'defRowS':'defRow',{i}),'');
    unitUI(); sum(); upd(); });
  $('addRow').onclick=()=>{ addRow(t($('unit').value==='장'?'defRowS':'defRow',{i:document.querySelectorAll('#rows .urow').length+1}),''); upd(); };
  // 단원 N개 × 같은 분량을 한 번에(리뷰: 단원 10개를 손으로 쳐야 했음)
  $('genGo').onclick=()=>{const n=Math.min(60,parseInt($('genN').value,10)||0), a=parseInt($('genA').value,10)||0; if(!(n>0&&a>0)) return; $('rows').innerHTML=''; for(let i=1;i<=n;i++) addRow(t($('unit').value==='장'?'defRowS':'defRow',{i}),a); upd(); $('genBox').open=false;};
  if($('cancel')) $('cancel').onclick=()=>{setupOpen=false;editing=null;render()};
  const w0=p?wdOf(p):WD_ALL; document.querySelectorAll('#wdRow [data-wd]').forEach(b=>{ const on0=w0.includes(+b.dataset.wd); b.classList.toggle('on',on0); b.setAttribute('aria-pressed',String(on0));
    b.onclick=()=>{ const on=document.querySelectorAll('#wdRow .chip.on').length; if(b.classList.contains('on')&&on<=1) return; b.classList.toggle('on'); b.setAttribute('aria-pressed',String(b.classList.contains('on'))); calcRun(); sbar(); }; });
  unitUI(); needLine(); calcRun(); sbar();
  $('save').onclick=save;
}
function addRow(name,amt,p0){
  const pg=$('unit')&&$('unit').value==='쪽';
  const r=document.createElement('div');r.className='urow'+(pg?' pg':'');
  const n=document.createElement('input');n.placeholder=t('rowName');n.value=name||'';n.setAttribute('aria-label',t('rowName'));
  const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label',t('rowDel'));x.onclick=()=>{r.remove();sum();$('rows').dispatchEvent(new Event('input'));};
  const numIn=(ph,v)=>{const a=document.createElement('input');a.type='number';a.min='1';a.inputMode='numeric';a.placeholder=ph;a.setAttribute('aria-label',ph);a.value=v||'';a.oninput=sum;return a;};
  if(pg){ const st=p0>0?p0:(amt>0?1:0); const a=numIn(t('rowFrom'),amt>0?st:''), b=numIn(t('rowTo'),amt>0?st+amt-1:''); /* 예전 쪽 책(p0 없음)은 1쪽부터로 보여 줌 */ const d=document.createElement('span'); d.className='muted'; d.textContent='~'; r.append(n,a,d,b,x); }
  else r.append(n,numIn(t('rowAmt'),amt),x);
  $('rows').appendChild(r); sum();
}
function rowsVal(){return [...document.querySelectorAll('#rows .urow')].map((r,i)=>{const ins=r.querySelectorAll('input'), name=ins[0].value.trim()||t('unitN',{i:i+1});
  if(r.classList.contains('pg')){ const a=parseInt(ins[1].value,10)||0, b=parseInt(ins[2].value,10)||0; return {name,amt:a>0&&b>=a?b-a+1:0,p0:a}; }
  return{name,amt:parseInt(ins[1].value,10)||0}}).filter(x=>x.amt>0)}
function sum(){const v=rowsVal();$('sum').textContent=v.length?t('sum',{n:v.length,q:q(v.reduce((a,x)=>a+x.amt,0),$('unit').value)}):''}
function wdVal(){ const w=[...document.querySelectorAll('#wdRow .chip.on')].map(b=>+b.dataset.wd).sort((a,b)=>a-b); return w.length?w:WD_ALL.slice(); }
function lecVals(){ const c=parseInt($('lecCount').value,10)||0, m=(parseInt($('lecH').value,10)||0)*60+(parseInt($('lecM').value,10)||0); return {c,m,s:parseFloat($('lecSpeed').value)||1}; }
function lecInfo(){ const {c,m,s}=lecVals(); $('lecInfo').textContent=c>0&&m>0?t('lecAvg',{a:Math.round(m/c),s,b:Math.round(m/c/s)}):t('lecAvgNone'); }
function saveLec(){ const isNew=editing===null;
  const {c,m,s}=lecVals(); if(!(c>0)){$('lecCount').focus();return} if(!(m>0)){$('lecH').focus();return} if(!$('goal').value){$('goal').focus();return}
  const name=$('lecName').value.trim()||t('kindLec');
  if(editing!==null){const p=S.plans[editing];rvFreeze(p);Object.assign(p,{book:name,goal:$('goal').value,totalMin:m,speed:s,wd:wdVal()});p.units[0].amt=Math.max(c,1);p.units[0].name=name;p.pos=Math.min(p.pos,c);S.cur=editing}
  else{S.plans.push({kind:'lec',book:name,unit:'강',goal:$('goal').value,wd:wdVal(),rounds:1,start:Date.now(),pos:0,log:[],totalMin:m,speed:s,units:[{name,amt:c,n:0,S:3,last:0}]});S.cur=S.plans.length-1}
  editing=null;setupOpen=false;tab='today';store(); if(!afterPlanSaved(isNew)) render();
}
function save(){ const isNew=editing===null;
  if($('rvFirst')&&$('rvFirst').value.trim()) S.rival=$('rvFirst').value.trim().slice(0,12);
  if(setupKind==='lec') return saveLec();
  const v=rowsVal(); if(!v.length||!$('goal').value){$('rows').querySelector('input[type=number]')?.focus();return}
  if(!(parseFloat($('minPer').value)>0)){ $('minPer').focus(); $('minPer').scrollIntoView({block:'center'}); return; }
  const base={book:$('book').value.trim()||t('myBook'),unit:$('unit').value,goal:$('goal').value,rounds:Math.max(1,parseInt($('rounds').value,10)||1),minPer:Math.max(0.5,parseFloat($('minPer').value)||MIN_DEF[$('unit').value]||6),fast:parseFloat($('fast').value)||FAST_DEF,wd:wdVal()};
  if(editing!==null){const p=S.plans[editing]; rvFreeze(p); const oldNames=p.units.map(u=>u.name); Object.assign(p,base);
    p.units=v.map(x=>{const old=p.units.find(u=>u.name===x.name);return {name:x.name,amt:x.amt,p0:x.p0>0?x.p0:undefined,n:old?old.n:0,S:old?old.S:3,last:old?old.last:0}});
    (p.rvH||[]).forEach(h=>{h.units=p.units.map(x=>{const i=oldNames.indexOf(x.name);return i>=0&&h.units[i]?h.units[i]:{n:0,S:3,last:0};});});
    S.cur=editing}
  else{S.plans.push({...base,start:Date.now(),pos:0,log:[],units:v.map(x=>({...x,n:0,S:3,last:0}))});S.cur=S.plans.length-1}
  editing=null;setupOpen=false;tab='today';store(); if(!afterPlanSaved(isNew)) render();
}
