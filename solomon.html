<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>솔로몬의 판결 — 재미로 가리는 누구 잘못</title>
<meta name="description" content="다툰 두 사람이 각자 자기 폰에서 주장하면, AI 재판장 솔로몬이 묻고 듣고 과실 비율로 판결합니다. 재미 판정이며 실제 법원과 무관합니다.">
<meta property="og:title" content="⚖️ 솔로몬의 판결 — 초대장이 도착했어요">
<meta property="og:description" content="우리 다툼, AI 재판장 솔로몬에게 같이 맡겨 봐요. 재미로 보는 AI 판정 · 실제 법원과 무관">
<meta property="og:image" content="https://hiarche.com/lab/og_solomon.png">
<meta property="og:url" content="https://hiarche.com/lab/solomon.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://cvuyarvywlkvxwfckqjb.supabase.co; img-src 'self' data: blob: https://cvuyarvywlkvxwfckqjb.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<style>
:root{--bg:#F3EEE6;--paper:#FFFDF8;--ink:#1F1B16;--soft:#5E554B;--line:#D6CCBE;--red:#A8361A;--green:#2F5D50;--gold:#B08A3E;--chip:#EFE7DB}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Pretendard','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:800;font-size:18px;color:var(--red);text-decoration:none}
.fun{font-size:11px;font-weight:700;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--paper)}
h1{margin:0;font-size:26px;line-height:1.25;letter-spacing:-.02em}
h2{margin:0;font-size:19px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
label{font-size:13px;font-weight:700;color:var(--soft)}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus{outline:3px solid #E9C9B9;border-color:var(--red)}
.count{font-size:12px;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:17px;background:var(--red);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.kakao{background:#FEE500;color:#1F1B16}
.small{font-size:13px;color:var(--soft)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .row{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);font-weight:700}
.bar{height:10px;background:#E4DACC;border-radius:99px;overflow:hidden}.bar div{height:100%;background:var(--red);transition:width .6s}
.q{background:#F4EADF;border-left:4px solid var(--red);border-radius:10px;padding:10px 12px;font-size:15px}
.q ol{margin:6px 0 0;padding-left:20px}
.vrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line, #e5ddd0);padding:10px 0;font:inherit;color:inherit;cursor:pointer}
.sum{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:15px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos button{position:absolute;top:2px;right:2px;border:0;border-radius:99px;background:#000a;color:#fff;width:22px;height:22px;cursor:pointer}
.addph{width:76px;height:76px;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;font-size:24px;color:var(--soft);cursor:pointer;background:#fff}
.counsel{border:1.5px solid var(--gold);background:#FBF5E8}
.doc{background:#FFFEF9;border:2px solid var(--ink);border-radius:6px;padding:20px 18px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.doc h2{text-align:center;letter-spacing:.5em;font-size:22px}
.doc .k{font-weight:800}
.order{display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:800;color:#fff}
.order div{display:flex;align-items:center;justify-content:center;min-width:0;padding:0 6px;white-space:nowrap}
.seal{text-align:right;color:var(--red);font-weight:800}
details{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
.rec{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:14px;white-space:pre-wrap}
.rec img{width:90px;height:90px;object-fit:cover;border-radius:8px;margin:4px 4px 0 0}
.env{perspective:900px;display:grid;place-items:center;padding:24px 0}
.envelope{width:280px;height:190px;background:#E9DCC6;border:2px solid #B9A47F;border-radius:8px;position:relative;box-shadow:0 12px 30px #0002;animation:drop .7s ease-out}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49%,#B9A47F 50%,transparent 51%),linear-gradient(225deg,transparent 49%,#B9A47F 50%,transparent 51%)}
.wax{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%);width:62px;height:62px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 2px 0 #7a240f}
@keyframes drop{from{transform:translateY(-40px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.help{border:2px solid var(--green)}
.help li{margin:4px 0}
.err{background:#FBE3D8;color:#7a240f;border-radius:10px;padding:10px 12px;font-size:14px}
.foot{font-size:12px;color:var(--soft);text-align:center;line-height:1.7}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #fff8;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<script>
(() => {
// ---------------- 설정 ----------------
const FN = 'https://cvuyarvywlkvxwfckqjb.supabase.co/functions/v1/solomon';
const SITE = 'https://hiarche.com/lab/solomon.html';
const MAXLEN = { claim: 1500, answer: 1500, arg: 900, final: 600 };
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ERR = {
  consent_required: '두 가지 확인에 체크해 주십시오.', too_short: '내용을 조금 더 적어 주십시오.', daily_limit: '오늘 법정 접수가 마감됐습니다. 내일 다시 와 주십시오.',
  not_found: '사건을 찾을 수 없습니다. 링크를 다시 확인해 주십시오.', not_your_turn: '지금은 상대 차례입니다.', counsel_limit: '이 사건의 변론 도우미을 모두 썼습니다.',
  photo_too_big: '사진이 너무 큽니다.', ai_error: '재판장이 잠시 자리를 비웠습니다. 잠시 뒤 다시 눌러 주십시오.', ai_not_configured: '법정 준비 중입니다. 조금 뒤 열립니다.',
  ai_limit: '이 사건은 더 진행할 수 없습니다.', already_claimed: '이미 다른 기기에서 열렸습니다. 원고에게 새 초대장을 요청하십시오.', busy: '처리 중입니다. 잠시 뒤 새로고침해 주십시오.',
  jury_full: '배심원은 한쪽에 3명까지 초대할 수 있어요.', already_voted: '이미 투표했어요. 배심원 한 명은 한 번만 투표할 수 있어요.', bad_vote: '과실 비율을 골라 주세요.', opinion_required: '내 의견을 다섯 글자 이상 적어 주세요.',
  ip_limit: '오늘은 이 연결에서 더 접수할 수 없습니다. 내일 다시 와 주십시오.', self_claim: '원고는 자기 사건의 피고로 참여할 수 없습니다. 초대장 링크를 상대에게 보내 주십시오.', server: '문제가 생겼습니다. 잠시 뒤 다시 시도해 주십시오.', network: '인터넷 연결을 확인해 주십시오.'
};
async function api(body) {
  let r;
  try { r = await fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); }
  catch { throw new Error('network'); }
  const j = await r.json().catch(() => ({ error: 'server' }));
  if (!r.ok || j.error) throw new Error(j.error || 'server');
  return j;
}
// 내 사건 열쇠(이 기기에만)
const store = {
  all() { try { return JSON.parse(localStorage.getItem('solomon_cases') || '[]'); } catch { return []; } },
  add(x) { try { const all = store.all(); const old = all.find((y) => y.id === x.id) || {}; const a = all.filter((y) => y.id !== x.id); a.unshift({ ...old, ...x }); localStorage.setItem('solomon_cases', JSON.stringify(a.slice(0, 50))); } catch {} },
  // 판결문 보관함: 이 기기에만 판결 요지를 따로 저장(서버 판결문이 1년 뒤 지워져도 남음, 원문은 저장 안 함)
  vault() { try { return JSON.parse(localStorage.getItem('solomon_vault') || '[]'); } catch { return []; } },
  keep(x) { try { const a = store.vault().filter((y) => y.id !== x.id); a.unshift(x); localStorage.setItem('solomon_vault', JSON.stringify(a.slice(0, 100))); } catch {} },
  unkeep(id) { try { localStorage.setItem('solomon_vault', JSON.stringify(store.vault().filter((y) => y.id !== id))); } catch {} },
  name(id, n) { try { const a = store.all(); const f = a.find((y) => y.id === id); if (f) { f.name = n; localStorage.setItem('solomon_cases', JSON.stringify(a)); } } catch {} },
};
const caseLink = (id, key) => `${SITE}#c=${encodeURIComponent(id)}&k=${encodeURIComponent(key)}`;
const inviteLink = (id, inv) => `${SITE}#c=${encodeURIComponent(id)}&i=${encodeURIComponent(inv)}`;
const fmtDue = (iso) => { try { const d = new Date(iso); return d.toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };

const header = () => `<div class="top"><a class="brand" href="${SITE}">⚖️ 솔로몬의 판결</a><span class="fun">재미 법정 · 실제 법원과 무관</span></div>`;
const footer = () => `<p class="foot">솔로몬은 AI가 하는 재미 판정이며 법적 효력이 없습니다. 법률 자문이 아닙니다.<br>이름·연락처는 받지 않아요. 제출한 글·사진은 판결 7일 뒤, 판결문은 1년 뒤 지워요.<br><a href="https://hiarche.com/legal.html">개인정보·이용 안내</a> · Arche</p>`;
const progress = (p, label) => `<div class="prog"><div class="row"><span>심리 진행도</span><span>${esc(label)} ${p}%</span></div><div class="bar"><div style="width:${p}%"></div></div></div>`;
const MODE = (m) => m === 'strict' ? '🧑‍⚖️ 엄격 재판부' : '😄 재미 재판부';
const stageOf = (v) => v.status === 'answer' ? '답변 대기' : v.status === 'arg' ? `변론 ${v.round}회` : v.status === 'final' ? '최종변론' : v.status === 'judged' ? '1심 판결' : '종료';
const kindLabel = (k) => k === 'complaint' ? '소장' : k === 'answer' ? '답변서' : /^arg\d+$/.test(k) ? `변론 ${k.slice(3)}회` : k === 'final_plaintiff' || k === 'final_defendant' ? '최종변론' : k;
const ROUND_NOTE = (max) => `변론은 솔로몬이 "새로운 내용이 더 없다"고 볼 때까지 오갑니다. 기본 요금에는 변론 ${max || 6}회까지 들어 있고, 공방이 길어져 ${max || 6}회를 넘기려면 추가 결제가 필요합니다(시범 기간에는 ${max || 6}회에서 바로 최종변론으로 넘어갑니다).`;
function busy(btn, on, text) { btn.disabled = on; btn.innerHTML = on ? `<span class="spin"></span>${text}` : text; }
function showErr(el, e) { el.hidden = false; el.textContent = ERR[e.message] || ERR.server; }

// ---------------- 사진(자동 축소) ----------------
function photoPicker(root) {
  const list = [];
  const box = root.querySelector('.photos');
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.multiple = true; input.hidden = true; root.appendChild(input);
  const render = () => {
    box.innerHTML = list.map((src, i) => `<div class="ph"><img src="${src}" alt="증거 사진 ${i + 1}"><button type="button" data-i="${i}" aria-label="사진 ${i + 1} 빼기">×</button></div>`).join('') + (list.length < 3 ? '<button type="button" class="addph" aria-label="증거 사진 추가">＋</button>' : '');
    box.querySelectorAll('button[data-i]').forEach((b) => b.onclick = () => { list.splice(+b.dataset.i, 1); render(); });
    const add = box.querySelector('.addph'); if (add) add.onclick = () => input.click();
  };
  input.onchange = async () => {
    for (const f of [...input.files].slice(0, 3 - list.length)) {
      try { list.push(await shrink(f)); } catch {}
    }
    input.value = ''; render();
  };
  render();
  return list;
}
function shrink(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.82, d = c.toDataURL('image/jpeg', q);
      while (d.length > 1_900_000 && q > 0.4) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      ok(d);
    };
    img.onerror = no; img.src = url;
  });
}
const photoBlock = () => `<label>증거 사진 (선택, 최대 3장)</label><div class="photos"></div><p class="small">사진 속 다른 사람의 얼굴·이름·전화번호는 가리고 올려 주십시오. 판결 뒤에는 상대도 볼 수 있습니다.</p>`;

// ---------------- 변호사·검사 ----------------
function counselBlock(role, left) {
  const who = '변론 도우미';
  return `<details class="card counsel" ${left ? '' : 'hidden'}><summary>✍️ ${who} (남은 ${left}회)</summary>
  <p class="small">사정을 편하게 털어놓으면 ${who}가 제출할 글을 다듬어 드려요. 없는 사실은 지어내지 않고, 이 대화는 상대에게 보이지 않아요. 글쓰기 도움이며 법률 상담이 아니에요.</p>
  <textarea class="cnotes" maxlength="1500" placeholder="예: 사실 어제 야근이라 늦게 왔고, 그 전에 미리 말했어요…" style="min-height:110px"></textarea>
  <button type="button" class="btn ghost cbtn">${who}에게 맡기기</button><div class="err cerr" hidden></div><p class="small ctips" hidden></p></details>`;
}
function wireCounsel(root, ctx, target) {
  const d = root.querySelector('.counsel'); if (!d) return;
  const btn = d.querySelector('.cbtn'), err = d.querySelector('.cerr'), tips = d.querySelector('.ctips');
  btn.onclick = async () => {
    err.hidden = true; busy(btn, true, '검토 중…');
    try {
      const r = await api({ action: 'counsel', case_id: ctx.id, key: ctx.key, notes: d.querySelector('.cnotes').value });
      target.value = r.draft; target.dispatchEvent(new Event('input'));
      tips.hidden = !r.tips?.length; tips.innerHTML = r.tips?.length ? '보완하면 좋은 점: ' + r.tips.map(esc).join(' · ') : '';
      d.querySelector('summary').textContent = `🧑‍⚖️ 초안을 아래 칸에 넣었습니다 — 읽고 고친 뒤 제출하십시오 (남은 ${r.counsel_left}회)`;
      if (!r.counsel_left) btn.hidden = true;
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (e) { showErr(err, e); }
    busy(btn, false, '다시 맡기기');
  };
}
function counter(ta, out, max) { const f = () => out.textContent = `${ta.value.length} / ${max}`; ta.addEventListener('input', f); f(); }

// ---------------- 화면: 소 제기 ----------------
function screenFile() {
  const mine = store.all();
  app.innerHTML = `${header()}
  <h1>억울하십니까?<br>솔로몬에게 소를 제기하십시오</h1>
  <p class="small">각자 자기 폰에서 주장하고, AI 재판장 솔로몬이 묻고 들은 뒤 과실 비율로 판결합니다. 판결 전까지 상대는 당신의 원문을 볼 수 없습니다.</p>
  <p class="small"><b>재미로 보는 AI 판정이에요. 법적 판단이 아니에요.</b> 쓴 글은 판정을 위해 AI 회사로 보내지고, 판정 뒤 상대도 보게 돼요.</p>
  <details class="small"><summary>재판은 이렇게 진행돼요</summary>① 소 제기 → ② 초대장 → ③ 피고 답변서 → ④ 변론(원고·피고 번갈아) → ⑤ 솔로몬이 변론 종결 → ⑥ 양측 최종변론 → ⑦ 1심 판결<br>${ROUND_NOTE(6)}</details>
  ${vaultBlock()}
  ${mine.length ? `<div class="card"><h2>내 사건</h2>${mine.map((m) => `<a href="${esc(caseLink(m.id, m.key))}">${m.role === 'plaintiff' ? '원고' : '피고'} · ${esc(m.name || '사건')}</a>`).join('<br>')}</div>` : ''}
  <form class="card" id="f">
    <label>재판부 고르기</label><div class="chips" id="mode"><button type="button" class="chip" aria-pressed="true" data-v="fun">😄 재미 판사</button><button type="button" class="chip" aria-pressed="false" data-v="strict">🧑‍⚖️ 엄격 판사</button></div>
    <p class="small" id="modehint">재미 판사: 재치 있는 사건명과 말투로 판결합니다.</p>

async function copy(t, id) {
  const b = document.getElementById(id);
  try { await navigator.clipboard.writeText(t); const o = b.textContent; b.textContent = '복사했습니다 ✓'; setTimeout(() => b.textContent = o, 1800); }
  catch { window.prompt('아래를 복사하십시오', t); }
}

async function screenInvite(id, inv) {
  if (store.all().some((m) => m.id === id && m.role === 'plaintiff')) {
    app.innerHTML = `${header()}<div class="err">${ERR.self_claim}</div><a class="btn ghost" href="${SITE}">처음으로</a>${footer()}`; return;
  }
  app.innerHTML = `${header()}<p class="small">초대장을 여는 중…</p>`;
  let v;
  try { v = await api({ action: 'peek', case_id: id, invite: inv }); }
  catch (e) {
    const mine = store.all().find((m) => m.id === id && m.role === 'defendant');
    if (e.message === 'already_claimed' && mine) { location.hash = caseLink(id, mine.key).split('#')[1]; return; }
    app.innerHTML = `${header()}<div class="err">${ERR[e.message] || ERR.server}</div><a class="btn ghost" href="${SITE}">처음으로</a>${footer()}`; return;
  }
  screenEnvelope(v, async (btn) => {
    busy(btn, true, '여는 중…');
    try {
      const priors = store.all().filter((m) => m.judged).map((m) => ({ case_id: m.id, key: m.key }));
      const r = await api({ action: 'claim', case_id: id, invite: inv, priors });
      store.add({ id, key: r.key, role: 'defendant', name: v.case_name });
      location.hash = caseLink(id, r.key).split('#')[1];
    } catch (e) { busy(btn, false, '참여하기'); alert(ERR[e.message] || ERR.server); }
  });
}

  }, 'image/png');
}

// ---------------- 화면: 배심원(친구가 받은 링크 #c=사건&j=표) ----------------
// 이름·로그인 없음, 링크 하나에 한 표. 솔로몬 의견 없는 사건 정리만 보고 투표 → 투표 뒤에 판결 공개
async function screenJury(id, tok) {
  app.innerHTML = `${header()}<p class="small">사건 정리를 여는 중…</p>`;
  let v;
  try { v = await api({ action: 'jury_view', case_id: id, token: tok }); }
  catch (e) { app.innerHTML = `${header()}<div class="card"><p>${esc(ERR[e.message] || ERR.server)}</p></div>${footer()}`; return; }
  const draw = () => {
    const facts = (v.facts || []).map((f) => `<li>${esc(f)}</li>`).join('');
    const dis = (v.disputed || []).map((d) => `<li><b>${esc(d.point)}</b><br>원고: ${esc(d.plaintiff)}<br>피고: ${esc(d.defendant)}</li>`).join('');
    const doc = `<div class="doc"><h2>사 건 정 리</h2><div class="small" style="text-align:center">솔로몬의 의견 없이, 두 사람의 글에서 사실만 모았어요</div>
      <div><span class="k">두 사람이 인정한 사실</span><ul>${facts}</ul></div>${dis ? `<div><span class="k">말이 엇갈리는 점</span><ul>${dis}</ul></div>` : ''}</div>`;
    if (!v.voted) {
      const chips = [1,2,3,4,5,6,7,8,9].map((i) => `<label class="chip"><input type="radio" name="jv" value="${i}"> ${i * 10}%</label>`).join('');
      app.innerHTML = `${header()}<h1>「${esc(v.case_name)}」</h1><p class="small">두 사람의 다툼을 읽고 누구 잘못이 더 큰지 골라 주세요. 누가 누군지는 알 수 없어요.</p>${doc}
        ${v.open ? `<h2>원고의 과실은 몇 %일까요?</h2><p class="small">나머지는 피고의 과실이에요. 50%는 둘 다 비슷하다는 뜻이에요.</p><div class="chips">${chips}</div>
        <label for="jo">내 의견</label><textarea id="jo" maxlength="300" placeholder="왜 그렇게 생각하는지 적어 주세요. 두 사람이 이 의견을 읽어요."></textarea>
        <p class="small">이름은 나가지 않고 '배심원 1·2…'로만 보여요. 상처 주는 말은 피해 주세요.</p>
        <button class="btn" id="jv" disabled>과실 비율을 골라 주세요</button><p class="err" id="je" hidden></p>
        <p class="small">배심원 한 명은 한 번만 투표할 수 있어요. 투표하면 솔로몬의 판결을 볼 수 있어요.</p>` : `<p class="small">이 사건의 배심원 투표는 끝났어요.</p>`}${footer()}`;
      if (!v.open) return;
      const btn = document.getElementById('jv');
      const jo = document.getElementById('jo');
      const sync = () => { const pk = app.querySelector('input[name=jv]:checked'); const ok = pk && jo.value.trim().length >= 5;
        btn.disabled = !ok; btn.textContent = !pk ? '과실 비율을 골라 주세요' : !ok ? '내 의견을 적어 주세요' : `원고 과실 ${pk.value * 10}%로 투표`; };
      app.querySelectorAll('input[name=jv]').forEach((r) => r.onchange = sync); jo.oninput = sync;
      btn.onclick = async () => {
        const pick = app.querySelector('input[name=jv]:checked'); if (!pick) return;
        busy(btn, true, '투표하는 중…');
        try { v = await api({ action: 'jury_vote', case_id: id, token: tok, vote: Number(pick.value), opinion: document.getElementById('jo').value.trim() }); draw(); }
        catch (e) { busy(btn, false, '다시 투표하기'); showErr(document.getElementById('je'), e); }
      };
      return;
    }
    const o = (v.verdict && v.verdict.order) || { plaintiff: 50, defendant: 50 };
    const j = v.jury || {};
    app.innerHTML = `${header()}<h1>「${esc(v.case_name)}」</h1><p class="small">투표해 주셔서 고마워요. 이제 솔로몬의 판결을 볼 수 있어요.</p>${doc}
      <div class="card"><p class="small">내 투표: 원고 과실 ${esc(v.my_vote)}%</p><h2>솔로몬의 판결</h2>
      <div class="bar"><div style="width:${o.plaintiff}%"></div></div><p>${esc((v.verdict || {}).order_text || '')}</p>
      <ul>${((v.verdict || {}).reasons || []).map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
      ${j.counted_each > 0 && j.plaintiff_fault != null ? `<p><b>배심원 평결(양쪽 ${j.counted_each}명씩): 원고 과실 ${j.plaintiff_fault}%</b></p>` : ''}</div>
      ${(j.opinions || []).filter((o) => (o.text || '').trim()).length ? `<h2>배심원 의견</h2>${(j.opinions || []).filter((o) => (o.text || '').trim()).map((o) => `<div class="card"><p class="small">배심원 ${esc(o.n)} · 원고 과실 ${esc(o.plaintiff_fault)}%</p><p>${esc(o.text)}</p></div>`).join('')}` : ''}
      <p class="small">이 링크를 나중에 다시 열면 다른 배심원 의견과 최종 평결을 볼 수 있어요. 링크를 저장해 두세요.</p>
      <a class="btn" href="${SITE}">우리 다툼도 솔로몬에게 맡기기</a>${footer()}`;
  };
  draw();
}

// ---------------- 길 찾기 ----------------
function route() {
  clearInterval(poll);
  const h = new URLSearchParams(location.hash.slice(1));
  // 예전 ?c=&k= 주소도 받아서 #로 옮김(열쇠가 서버 기록에 남지 않게)
  const q = new URLSearchParams(location.search);
  if (q.get('c') && (q.get('k') || q.get('i')) && !h.get('c')) { history.replaceState(null, '', SITE + '#' + q.toString()); return route(); }
  const id = h.get('c'), key = h.get('k'), inv = h.get('i'), jt = h.get('j');
  if (id && key) screenCase(id, key); else if (id && inv) screenInvite(id, inv); else if (id && jt) screenJury(id, jt); else screenFile();
}
window.addEventListener('hashchange', route);
route();
})();
</script>
